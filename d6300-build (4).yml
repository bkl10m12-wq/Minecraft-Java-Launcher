              private var layoutRef: WeakReference<ViewGroup>? = null
              private var currentSurface: Surface? = null
              private var currentSource: Any? = null

              /** A game that needs SDL has been launched (set by LumenSdl.activate). */
              @Volatile
              private var wanted = false

              private var jniReady = false
              private var sdlInitialized = false

              @Volatile
              private var hidAcquired = false

              @Volatile
              private var inputListenerRegistered = false

              @JvmStatic
              @Synchronized
              fun setupJNI(): Boolean {
                  if (jniReady) {
                      return true
                  }
                  SDL.setupJNI()
                  jniReady = true

                  acquireHIDDeviceManager()

                  if (SDLControllerManager.pollInputDevicesSafely("jni-setup")) {
                      Logging.i(TAG, "Input devices synced after SDL JNI setup")
                  }
                  return true
              }

              private fun acquireHIDDeviceManager() {
                  if (hidAcquired) return
                  val context = SDL.getContext() ?: return
                  hidAcquired = true
                  try {
                      HIDDeviceManager.acquire(context)
                  } catch (t: Throwable) {
                      Logging.w(TAG, "HIDDeviceManager acquire failed", t)
                  }
              }

              private fun registerInputDeviceListener(context: Context) {
                  if (inputListenerRegistered) return
                  val inputManager = context.getSystemService(InputManager::class.java) ?: return
                  inputListenerRegistered = true

                  val listener = object : InputManager.InputDeviceListener {
                      override fun onInputDeviceAdded(deviceId: Int) = syncInputDevices("added", deviceId)
                      override fun onInputDeviceRemoved(deviceId: Int) = syncInputDevices("removed", deviceId)
                      override fun onInputDeviceChanged(deviceId: Int) = syncInputDevices("changed", deviceId)
                  }
                  inputManager.registerInputDeviceListener(listener, null)
              }

              private fun isGamepad(device: InputDevice): Boolean {
                  val s = device.sources
                  return (s and InputDevice.SOURCE_GAMEPAD) == InputDevice.SOURCE_GAMEPAD ||
                      (s and InputDevice.SOURCE_JOYSTICK) == InputDevice.SOURCE_JOYSTICK
              }

              private fun syncInputDevices(action: String, deviceId: Int) {
                  if (!sdlEnabled) return
                  val device = InputDevice.getDevice(deviceId)
                  if (device != null && !isGamepad(device)) return
                  SDLControllerManager.pollInputDevicesSafely(action)
              }

              @JvmStatic
              @Synchronized
              fun markSdlInitialized(): Boolean {
                  if (sdlInitialized) return false
                  sdlInitialized = true
                  return true
              }

              @JvmStatic
              @Synchronized
              fun clearSdlInitialized() {
                  sdlInitialized = false
              }

              @JvmStatic
              @Volatile
              var sdlEnabled: Boolean = false

              /** SDL asks for the soft keyboard: the Lumen UI always lets it show. */
              @JvmStatic
              fun getSdlImeAutoShowEnabled(): Boolean = true

              @JvmStatic
              fun requestComposeFocus() {
                  // Lumen uses plain views, there is no Compose focus to hand back.
              }

              // ------------------------------------------------------------------ surface lifecycle

              private fun unwrapActivity(context: Context?): Activity? {
                  var c = context
                  while (c is ContextWrapper) {
                      if (c is Activity) return c
                      c = c.baseContext
                  }
                  return null
              }

              /** Called by MinecraftGLSurface whenever it has a (new) Surface. Cheap and safe for every game. */
              @JvmStatic
              fun onSurfaceAvailable(view: View, surface: Surface) {
                  val activity = unwrapActivity(view.context) ?: return
                  val layout = view.parent as? ViewGroup
                  activityRef = WeakReference(activity)
                  layoutRef = WeakReference(layout)
                  currentSurface = surface
                  currentSource = view
                  if (wanted) {
                      runOnMain { prepareSurfaceNow(activity, surface, layout, view) }
                  }
              }

              /** Called when a game that needs SDL is launched. Blocks (briefly) until the SDL surface exists. */
              @JvmStatic
              fun activate() {
                  wanted = true
                  val activity = activityRef?.get() ?: run {
                      Logging.w(TAG, "activate(): no surface registered yet, SDL surface will be bound when it appears")
                      return
                  }
                  val surface = currentSurface ?: return
                  val layout = layoutRef?.get()
                  val source = currentSource
                  val latch = CountDownLatch(1)
                  runOnMain {
                      try {
                          prepareSurfaceNow(activity, surface, layout, source)
                      } finally {
                          latch.countDown()
                      }
                  }
                  if (!latch.await(10, TimeUnit.SECONDS)) {
                      Logging.w(TAG, "activate(): timed out waiting for the main thread")
                  }
              }

              private fun runOnMain(block: () -> Unit) {
                  val looper = Looper.getMainLooper()
                  if (Looper.myLooper() == looper) block() else Handler(looper).post(block)
              }

              private fun prepareSurfaceNow(activity: Activity, surface: Surface, layout: ViewGroup?, source: Any?) {
                  try {
                      currentSurface = surface
                      currentSource = source
                      registerInputDeviceListener(activity)
                      if (SDLActivity.getSDLSurface() == null) {
                          SDL.initialize()
                          SDL.setContext(activity)
                          SDLActivity.externalInitialize(SDLSurface(activity), layout, surface)
                      } else {
                          SDLSurface.setNativeSurface(surface)
                          if (sdlEnabled) SDLActivity.getSDLSurface()?.surfaceChanged()
                      }
                  } catch (t: Throwable) {
                      Logging.e(TAG, "prepareSurface failed", t)
                  }
              }

              /** MinecraftGLSurface.refreshSize() -> keeps SDL's window size in sync. Main thread. */
              @JvmStatic
              fun onSizeChanged(width: Int, height: Int) {
                  if (!sdlEnabled) return
                  try {
                      val s = SDLActivity.getSDLSurface() ?: return
                      s.surfaceChanged()
                      s.nativeResize(width, height)
                  } catch (t: Throwable) {
                      Logging.w(TAG, "onSizeChanged failed", t)
                  }
              }

              @JvmStatic
              fun onSurfaceDestroyed(surface: Surface?) {
                  if (surface != null && currentSurface === surface) {
                      currentSurface = null
                      currentSource = null
                      if (sdlEnabled) {
                          try {
                              SDLActivity.getSDLSurface()?.surfaceDestroyed()
                          } catch (t: Throwable) {
                              Logging.w(TAG, "surfaceDestroyed failed", t)
                          }
                      }
                  }
              }

              @JvmStatic
              @Synchronized
              fun reset() {
                  currentSurface = null
                  currentSource = null
                  activityRef = null
                  layoutRef = null
                  jniReady = false
                  sdlInitialized = false
                  sdlEnabled = false
                  wanted = false
                  SDLSurface.clearNativeSurface()
                  SDL.initialize()
              }

              @JvmStatic
              external fun initializeControllerSubsystems()

              @JvmStatic
              external fun isSdlRenderActive(): Boolean

              @JvmStatic
              external fun setNativeTextInputActive(active: Boolean): Boolean

              @JvmStatic
              external fun isNativeTextInputActive(): Boolean
          }
          D6300_EOF
          mkdir -p .
          cat > LumenSdl.kt <<'D6300_EOF'
          package com.movtery.zalithlauncher.feature.lumen

          import android.content.Context
          import android.os.Process
          import com.movtery.zalithlauncher.feature.log.Logging
          import com.movtery.zalithlauncher.game.sdl.SdlBridge
          import com.movtery.zalithlauncher.utils.path.PathManager
          import net.kdt.pojavlaunch.JMinecraftVersionList
          import net.kdt.pojavlaunch.Tools
          import java.io.File
          import java.io.FileOutputStream

          /**
           * Lumen: support for Minecraft versions that need LWJGL 3.4.x + SDL3 (26.3 and newer).
           *
           * Old versions never touch any of this: [active] is only true when the version json lists
           * org.lwjgl:lwjgl-sdl. The LWJGL 3.4.1 jars and natives come from Zalith Launcher 2 (GPL-3.0)
           * and are bundled by the build workflow (assets/lumen_lwjgl34 and the lwjgl-3.4.1-natives AAR).
           */
          object LumenSdl {
              private const val TAG = "LumenSdl"

              /** Bump to force a re-extract of the bundled LWJGL 3.4.1 files. */
              private const val COMPONENT_VERSION = "lumen-lwjgl341-1"

              private const val ASSET_JARS = "lumen_lwjgl34"
              private const val ASSET_NATIVES = "app_runtime/lwjgl/3.4.1/natives"

              /** True for the game currently being launched when it needs the SDL path. */
              @JvmField
              @Volatile
              var active: Boolean = false

              @JvmStatic
              fun needsLwjgl34(info: JMinecraftVersionList.Version?): Boolean {
                  val libs = info?.libraries ?: return false
                  for (lib in libs) {
                      val name = lib?.name ?: continue
                      if (name.startsWith("org.lwjgl:lwjgl-sdl")) return true
                  }
                  return false
              }

              @JvmStatic
              fun rootDir(): File = File(PathManager.DIR_GAME_HOME, "lwjgl34")

              @JvmStatic
              fun nativesDir(): File = File(rootDir(), "natives")

              /** Classpath entries (absolute paths): lwjgl.jar, merged modules, then the rest. */
              @JvmStatic
              fun classpathJars(): List<String> {
                  val jars = rootDir().listFiles { f -> f.name.endsWith(".jar") && f.name != "lwjgl-lwjglx.jar" }
                      ?: return emptyList()
                  fun rank(n: String) = when {
                      n == "lwjgl.jar" -> 0
                      n.endsWith("-merged-modules.jar") -> 1
                      else -> 2
                  }
                  return jars.sortedWith(compareBy({ rank(it.name) }, { it.name })).map { it.absolutePath }
              }

              /**
               * Called on a worker thread right before the JVM starts for an SDL game.
               * Extracts the bundled jars/natives (once) and wakes the SDL surface glue.
               * Returns false if the files could not be prepared (the game then fails with a clear log line).
               */
              @JvmStatic
              @Synchronized
              fun prepare(context: Context): Boolean {
                  active = true
                  val ok = ensureUnpacked(context)
                  if (ok) {
                      try {
                          SdlBridge.activate()
                      } catch (t: Throwable) {
                          Logging.e(TAG, "SdlBridge.activate failed", t)
                      }
                  }
                  return ok
              }

              @JvmStatic
              @Synchronized
              fun ensureUnpacked(context: Context): Boolean {
                  val root = rootDir()
                  val marker = File(root, "version")
                  try {
                      if (marker.isFile && marker.readText().trim() == COMPONENT_VERSION &&
                          (nativesDir().list()?.isNotEmpty() == true) && classpathJars().isNotEmpty()
                      ) {
                          return true
                      }
                      root.deleteRecursively()
                      nativesDir().mkdirs()
                      val am = context.assets

                      val jarNames = am.list(ASSET_JARS) ?: emptyArray()
                      if (jarNames.isEmpty()) throw IllegalStateException("no bundled LWJGL 3.4.1 jars in assets/$ASSET_JARS")
                      for (name in jarNames) {
                          am.open("$ASSET_JARS/$name").use { input ->
                              FileOutputStream(File(root, name)).use { out -> input.copyTo(out) }
                          }
                      }

                      val abi = if (Process.is64Bit()) "arm64-v8a" else "armeabi-v7a"
                      val nativeNames = am.list("$ASSET_NATIVES/$abi") ?: emptyArray()
                      if (nativeNames.isEmpty()) throw IllegalStateException("no bundled LWJGL 3.4.1 natives for $abi")
                      for (name in nativeNames) {
                          am.open("$ASSET_NATIVES/$abi/$name").use { input ->
                              FileOutputStream(File(nativesDir(), name)).use { out -> input.copyTo(out) }
                          }
                      }
                      marker.writeText(COMPONENT_VERSION)
                      Logging.i(TAG, "LWJGL 3.4.1 unpacked: ${jarNames.size} jars, ${nativeNames.size} natives ($abi)")
                      return true
                  } catch (t: Throwable) {
                      Logging.e(TAG, "Could not unpack the LWJGL 3.4.1 files", t)
                      Tools.showErrorRemote(t)
                      return false
                  }
              }
          }
          D6300_EOF
          mkdir -p .
          cat > lumen_sdl_reset.sh <<'D6300_EOF'
          #!/bin/bash
          # Puts the source tree back to the state it had before apply_sdl.py ran (the snapshot commit made by the
          # workflow). Only paths that apply_sdl.py creates are cleaned, so the Rust libraries / JRE jars built earlier
          # in the same job are kept.
          set +e
          git reset --hard -q
          git clean -fdq -- \
            ZalithLauncher/src/main/java/org/libsdl \
            ZalithLauncher/src/main/java/com/movtery/zalithlauncher/game \
            ZalithLauncher/src/main/java/com/movtery/zalithlauncher/feature/lumen/LumenSdl.kt \
            ZalithLauncher/src/main/assets/lumen_lwjgl34 \
            ZalithLauncher/libs \
            ZalithLauncher/src/main/jni
          rm -rf ZalithLauncher/build
          echo "source tree restored (no SDL3 support)"
          D6300_EOF

      - name: Apply D6300 patch
        env:
          LUMEN_SOURCE_URL: https://github.com/${{ github.repository }}
          LUMEN_PLAY: ${{ inputs.play_edition }}
          LUMEN_APP_ID: ${{ inputs.application_id }}
        run: python3 apply_d6300.py

      - name: Check out Zalith Launcher 2 (only to take its SDL3 support, pinned commit)
        id: z2
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: ZalithLauncher/ZalithLauncher2
          ref: 5822eb4fde29c97e95723eb6c045a0b593c3e5f7
          path: lumen_sdl_src

      - name: Add SDL3 support for Minecraft 26.3+ (test feature, falls back by itself)
        env:
          LUMEN_Z2_OUTCOME: ${{ steps.z2.outcome }}
        run: |
          set +e
          mkdir -p lumen-build-info
          echo "sdl=0" > lumen-build-info/sdl_state
          if [ "$LUMEN_Z2_OUTCOME" != "success" ]; then
            echo "::warning::Could not fetch Zalith Launcher 2, the APK will be built WITHOUT SDL3 support" | tee lumen-build-info/sdl-patch.log
            exit 0
          fi
          printf 'lumen_sdl_src/\nlumen-build-info/\n' >> .git/info/exclude
          git add -A > /dev/null 2>&1
          if ! git -c user.name=lumen -c user.email=lumen@example.invalid commit -q -m "before SDL3 patch" > /dev/null 2>&1; then
            echo "::warning::Could not snapshot the source tree, the APK will be built WITHOUT SDL3 support" | tee lumen-build-info/sdl-patch.log
            exit 0
          fi
          LUMEN_SDL_SRC=lumen_sdl_src python3 apply_sdl.py > lumen-build-info/sdl-patch.log 2>&1
          RC=$?
          tail -n 12 lumen-build-info/sdl-patch.log
          if [ "$RC" -eq 0 ]; then
            echo "sdl=1" > lumen-build-info/sdl_state
            echo "SDL3 patch applied"
          else
            echo "::warning::The SDL3 patch did not apply (exit $RC), the APK will be built WITHOUT SDL3 support"
            bash lumen_sdl_reset.sh
          fi
          exit 0

      - name: Build Rust core for arm64 (tests run here; APK still builds if this fails)
        continue-on-error: true
        run: |
          set -e
          rustup target add aarch64-linux-android
          NDK="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-}}"
          if [ -z "$NDK" ] || [ ! -d "$NDK" ]; then NDK="$(ls -d "$ANDROID_SDK_ROOT"/ndk/* | sort -V | tail -1)"; fi
          echo "Using NDK: $NDK"
          TOOLBIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$TOOLBIN/aarch64-linux-android26-clang"
          (cd d6300-core && cargo test --release && cargo build --release --target aarch64-linux-android)
          mkdir -p ZalithLauncher/src/main/jniLibs/arm64-v8a
          cp d6300-core/target/aarch64-linux-android/release/libd6300core.so ZalithLauncher/src/main/jniLibs/arm64-v8a/
          ls -l ZalithLauncher/src/main/jniLibs/arm64-v8a/libd6300core.so

      - name: Build Rust core for arm32 (APK still builds if this fails)
        continue-on-error: true
        run: |
          set -e
          rustup target add armv7-linux-androideabi
          NDK="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-}}"
          if [ -z "$NDK" ] || [ ! -d "$NDK" ]; then NDK="$(ls -d "$ANDROID_SDK_ROOT"/ndk/* | sort -V | tail -1)"; fi
          TOOLBIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_LINKER="$TOOLBIN/armv7a-linux-androideabi26-clang"
          (cd d6300-core && cargo build --release --target armv7-linux-androideabi)
          mkdir -p ZalithLauncher/src/main/jniLibs/armeabi-v7a
          cp d6300-core/target/armv7-linux-androideabi/release/libd6300core.so ZalithLauncher/src/main/jniLibs/armeabi-v7a/
          ls -l ZalithLauncher/src/main/jniLibs/armeabi-v7a/libd6300core.so

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build JRE JAR files
        run: |
          chmod +x gradlew
          mkdir out
          ./gradlew jre_lwjgl3glfw:build --no-daemon

      - name: Build debug APK (arm32 + arm64 in one APK; SDL3 variant first, normal build as fallback)
        run: |
          set +e
          chmod +x gradlew
          mkdir -p lumen-build-info lumen-upload
          SDL=0
          if grep -q '^sdl=1' lumen-build-info/sdl_state 2>/dev/null; then SDL=1; fi
          VARIANT="standard (no SDL3)"
          APKNAME="Lumen-Launcher-no-SDL3.apk"
          if [ "$SDL" = "1" ]; then
            ./gradlew ZalithLauncher:assembleDebug "-Darch=arm+arm64" > lumen-build-info/gradle-sdl.log 2>&1
            RC=$?
            APK="$(ls ZalithLauncher/build/outputs/apk/debug/*.apk 2>/dev/null | head -1)"
            if [ "$RC" -eq 0 ] && [ -n "$APK" ] \
               && unzip -l "$APK" | grep -q 'assets/lumen_lwjgl34/lwjgl.jar' \
               && unzip -l "$APK" | grep -q 'lib/arm64-v8a/libSDL3.so' \
               && unzip -l "$APK" | grep -q 'natives/arm64-v8a/liblwjgl.so'; then
              VARIANT="SDL3 test build (Minecraft 26.3+ experiment)"
              APKNAME="Lumen-Launcher-SDL3-test.apk"
              tail -n 5 lumen-build-info/gradle-sdl.log
            else
              echo "::warning::The SDL3 variant did not build (exit $RC). Building the normal APK instead."
              { echo "gradle exit code: $RC"; grep -n -E "^e: |error:|FAILED|What went wrong" -A4 lumen-build-info/gradle-sdl.log | tail -n 160; } > lumen-build-info/sdl-build-error.txt
              tail -n 60 lumen-build-info/sdl-build-error.txt
              bash lumen_sdl_reset.sh
              SDL=0
            fi
          fi
          if [ "$SDL" = "0" ]; then
            ./gradlew ZalithLauncher:assembleDebug "-Darch=arm+arm64"
            RC=$?
            if [ "$RC" -ne 0 ]; then echo "::error::Gradle build failed (exit $RC)"; exit "$RC"; fi
          fi
          APK="$(ls ZalithLauncher/build/outputs/apk/debug/*.apk | head -1)"
          cp "$APK" "lumen-upload/$APKNAME"
          {
            echo "Lumen Launcher build info"
            echo "variant: $VARIANT"
            echo "Zalith Launcher (base): ed8a5c873b25f19d08aef5bdfc1084fd9aff836c"
            echo "Zalith Launcher 2 (SDL3 source, GPL-3.0): 5822eb4fde29c97e95723eb6c045a0b593c3e5f7"
            echo "built (UTC): $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "runner image: ${ImageVersion:-unknown}"
          } > lumen-build-info/BUILD_INFO.txt
          cp lumen-build-info/BUILD_INFO.txt lumen-upload/
          for f in sdl-patch.log sdl-build-error.txt; do
            if [ -f "lumen-build-info/$f" ]; then cp "lumen-build-info/$f" lumen-upload/; fi
          done
          ls -l lumen-upload
          cat lumen-build-info/BUILD_INFO.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Lumen-Launcher-debug-arm32-arm64
          path: lumen-upload/*

      - name: Check what is inside the APK
        run: |
          set +e
          APK="$(ls ZalithLauncher/build/outputs/apk/debug/*.apk | head -1)"
          echo "APK: $APK"
          ls -l "$APK"
          unzip -l "$APK" | grep -E 'lib/(armeabi-v7a|arm64-v8a|x86|x86_64)/lib(pojavexec|d6300core)\.so' || true
          FAIL=0
          for ABI in armeabi-v7a arm64-v8a; do
            if ! unzip -l "$APK" | grep -q "lib/$ABI/libpojavexec.so"; then echo "::error::$ABI libpojavexec.so is MISSING from the APK"; FAIL=1; fi
            if ! unzip -l "$APK" | grep -q "lib/$ABI/libd6300core.so"; then echo "::warning::$ABI libd6300core.so (Rust core) is not in the APK: stats and frame limiter will be off on $ABI"; fi
          done
          for ABI in x86 x86_64; do
            if unzip -l "$APK" | grep -q "lib/$ABI/"; then echo "::warning::unexpected $ABI libraries in the APK"; fi
          done
          exit $FAIL
