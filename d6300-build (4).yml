              // ---- refresh rate lock + frame limiter ---------------------------------------------------

              private fun defaultDisplay(context: Context): Display? =
                  try {
                      (context.getSystemService(Context.DISPLAY_SERVICE) as DisplayManager).getDisplay(Display.DEFAULT_DISPLAY)
                  } catch (t: Throwable) {
                      null
                  }

              /**
               * The display mode with the highest refresh rate at the panel's current resolution (the same idea as
               * FoldCraftLauncher's applyMaxRefreshRatePolicy). Null when the display or its modes cannot be read.
               */
              private fun bestMode(display: Display?): Display.Mode? {
                  if (display == null) return null
                  return try {
                      val cur = display.mode
                      var best = cur
                      for (m in display.supportedModes) {
                          if (m.physicalWidth == cur.physicalWidth && m.physicalHeight == cur.physicalHeight &&
                              m.refreshRate > best.refreshRate
                          ) {
                              best = m
                          }
                      }
                      best
                  } catch (t: Throwable) {
                      null
                  }
              }

              private fun hz(value: Float): String = String.format(Locale.US, "%.1f", value)

              @JvmStatic
              fun refreshLockOn(): Boolean = lockUnit.getValue() != "0"

              fun refreshLockText(): String =
                  if (refreshLockOn()) "ON: panel ko hamesha sabse tez refresh rate pe rakhne ki request" else "OFF: Android khud refresh rate badalta hai"

              /**
               * Asks Android to keep the panel at its highest refresh rate while the game window is open (FoldCraftLauncher
               * does the same by default; Zalith has no such code). Whether this helps fps is NOT proven: the stability
               * report records the panel rate every second (display_hz) so it can be checked. Never throws.
               */
              @JvmStatic
              fun applyWindowRate(activity: Activity) {
                  try {
                      if (!refreshLockOn()) {
                          lockText = "Refresh lock: off"
                          return
                      }
                      val display = defaultDisplay(activity)
                      val best = bestMode(display)
                      if (display == null || best == null) {
                          lockText = "Refresh lock: panel modes unreadable"
                          return
                      }
                      val lp = activity.window.attributes
                      lp.preferredDisplayModeId = best.modeId
                      activity.window.attributes = lp
                      lockText = "Refresh lock: window asked for mode " + best.modeId + " (" + hz(best.refreshRate) +
                          " Hz), panel was at " + hz(display.refreshRate) + " Hz"
                  } catch (t: Throwable) {
                      lockText = "Refresh lock: failed (" + t.javaClass.simpleName + ")"
                  }
              }

              /** Frame-rate vote for the game surface (Android 11+), like Amethyst: only when the switch is seamless. Never throws. */
              @JvmStatic
              fun applySurfaceRate(surface: Surface?) {
                  try {
                      if (surface == null || !refreshLockOn()) return
                      val best = bestMode(defaultDisplay(ContextExecutor.getApplication())) ?: return
                      if (Build.VERSION.SDK_INT >= 31) {
                          surface.setFrameRate(
                              best.refreshRate,
                              Surface.FRAME_RATE_COMPATIBILITY_FIXED_SOURCE,
                              Surface.CHANGE_FRAME_RATE_ONLY_IF_SEAMLESS
                          )
                          surfaceRateText = "surface frame-rate vote " + hz(best.refreshRate) + " Hz (seamless only)"
                      } else if (Build.VERSION.SDK_INT >= 30) {
                          surface.setFrameRate(best.refreshRate, Surface.FRAME_RATE_COMPATIBILITY_FIXED_SOURCE)
                          surfaceRateText = "surface frame-rate vote " + hz(best.refreshRate) + " Hz"
                      } else {
                          surfaceRateText = "surface frame-rate vote: needs Android 11+"
                      }
                  } catch (t: Throwable) {
                      surfaceRateText = "surface frame-rate vote failed (" + t.javaClass.simpleName + ")"
                  }
              }

