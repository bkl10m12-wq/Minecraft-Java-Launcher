          package com.movtery.zalithlauncher.feature.stability

          import android.app.ActivityManager
          import android.app.ApplicationExitInfo
          import android.content.Context
          import android.os.Build
          import android.util.Log
          import com.movtery.zalithlauncher.utils.file.FileTools
          import java.io.File
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale
          import java.util.zip.ZipOutputStream

          /**
           * Helpers around the stability reports (.txt + .csv written by StabilityMonitor):
           *  - addToZip: puts the newest reports and the exit-reason list into the zip made by the main-menu
           *    "Share logs" button, so one tap sends everything needed to find the cause of lag or a crash;
           *  - logExitReasons: asks Android why the app / game process died last time (low memory kill, crash, ...).
           */
          object StabilityReports {
              private const val TAG = "StabilityReports"
              private const val MAX_FILES = 4
              private const val EXIT_FILE = "exit_reasons.txt"
              private const val GC_FILE = "gc_latest.log"

              private fun reportsDir(context: Context): File? {
                  val base = context.getExternalFilesDir(null) ?: return null
                  return File(base, "stability")
              }

              /** Called from ZHTools.shareLogs inside its zip try-block. Never throws. */
              @JvmStatic
              fun addToZip(context: Context, zos: ZipOutputStream) {
                  try {
                      val dir = reportsDir(context) ?: return
                      val files = dir.listFiles { f ->
                          f.isFile && f.name != EXIT_FILE && (f.name.endsWith(".txt") || f.name.endsWith(".csv"))
                      } ?: emptyArray<File>()
                      for (file in files.sortedByDescending { it.lastModified() }.take(MAX_FILES)) {
                          FileTools.zipFile(file, "stability/" + file.name, zos)
                      }
                      val exit = File(dir, EXIT_FILE)
                      if (exit.isFile) FileTools.zipFile(exit, "stability/" + exit.name, zos)
                      // GC + safepoint log of the last game launch (written by the JVM, see PerformancePreset.gcLogArgs)
                      val gc = File(dir, GC_FILE)
                      if (gc.isFile) FileTools.zipFile(gc, "stability/" + gc.name, zos)
                  } catch (t: Throwable) {
                      Log.w(TAG, "Could not add reports to the zip", t)
                  }
              }

              private fun reasonName(reason: Int): String = when (reason) {
                  ApplicationExitInfo.REASON_LOW_MEMORY -> "LOW_MEMORY (Android killed it: not enough RAM)"
                  ApplicationExitInfo.REASON_CRASH -> "CRASH (Java exception)"
                  ApplicationExitInfo.REASON_CRASH_NATIVE -> "CRASH_NATIVE (native crash)"
                  ApplicationExitInfo.REASON_SIGNALED -> "SIGNALED (killed by a signal, status 9 = SIGKILL)"
                  ApplicationExitInfo.REASON_ANR -> "ANR (app not responding)"
                  ApplicationExitInfo.REASON_EXIT_SELF -> "EXIT_SELF (app exited itself)"
                  ApplicationExitInfo.REASON_USER_REQUESTED -> "USER_REQUESTED"
                  ApplicationExitInfo.REASON_USER_STOPPED -> "USER_STOPPED"
                  ApplicationExitInfo.REASON_DEPENDENCY_DIED -> "DEPENDENCY_DIED"
                  ApplicationExitInfo.REASON_EXCESSIVE_RESOURCE_USAGE -> "EXCESSIVE_RESOURCE_USAGE"
                  ApplicationExitInfo.REASON_INITIALIZATION_FAILURE -> "INITIALIZATION_FAILURE"
                  ApplicationExitInfo.REASON_PERMISSION_CHANGE -> "PERMISSION_CHANGE"
                  ApplicationExitInfo.REASON_OTHER -> "OTHER"
                  ApplicationExitInfo.REASON_UNKNOWN -> "UNKNOWN"
                  else -> "reason $reason"
              }

              /**
               * Writes the last few process deaths of this app (Android 11+) to stability/exit_reasons.txt.
               * This tells a low-memory kill apart from a real crash, which a game log cannot.
               * Runs on a background thread. Never throws.
               */
              @JvmStatic
              fun logExitReasons(context: Context) {
                  if (Build.VERSION.SDK_INT < 30) return
                  val app = context.applicationContext
                  Thread {
                      try {
                          val dir = reportsDir(app) ?: return@Thread
                          dir.mkdirs()
                          val am = app.getSystemService(Context.ACTIVITY_SERVICE) as ActivityManager
                          val list = am.getHistoricalProcessExitReasons(null, 0, 8)
                          val fmt = SimpleDateFormat("yyyy-MM-dd HH:mm:ss", Locale.US)
                          val sb = StringBuilder("Why did the app / game process die? (Android ApplicationExitInfo, newest first)\n")
                          if (list.isEmpty()) sb.append("(no records)\n")
                          for (e in list) {
                              sb.append(fmt.format(Date(e.timestamp))).append("  ")
                                  .append(e.processName).append("  ")
                                  .append(reasonName(e.reason)).append("  status=").append(e.status)
                                  .append("  rss=").append(e.rss / 1024L).append(" MB")
                                  .append("  ").append(e.description ?: "").append('\n')
                          }
                          File(dir, EXIT_FILE).writeText(sb.toString())
                      } catch (t: Throwable) {
                          Log.w(TAG, "Could not read exit reasons", t)
                      }
                  }.start()
              }
          }
