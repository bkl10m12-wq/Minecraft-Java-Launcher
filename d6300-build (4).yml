                          SDLActivity.onNativeMouse(0, MotionEvent.ACTION_MOVE, x, y, false);
                      }
                      sSdlLastX = x;
                      sSdlLastY = y;
                      sSdlLastValid = true;
                      sSdlLastGrab = grab;
                  } catch (Throwable ignored) {
                  }
              }

