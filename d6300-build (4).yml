               * heap not pre-sized). Reason, measured in the user's stability report (4 GB phone): the game
               * process kept 470-990 MB in RAM and 700-1450 MB in swap while MemAvailable was only 366-770 MB.
               * The player can switch back in Video settings -> GC mode; that choice is kept.
               */
              private fun resetGcModeOnce() {
                  try {
                      if (gcFixUnit.getValue() == "1") return
                      val builder = gcFixUnit.put("1")
                      val mode = gcUnit.getValue()
                      if ((mode == GC_DEFAULT || mode == GC_SERIAL) &&
                          totalRamMb(ContextExecutor.getApplication()) <= 4600L
                      ) {
                          builder.put(gcUnit, GC_LOWRAM)
                          Logging.i("PerformancePreset", "GC mode $mode -> $GC_LOWRAM (device has <= 4.6 GB RAM)")
                      }
                      builder.save()
                  } catch (e: Exception) {
                      Logging.e("PerformancePreset", "resetGcModeOnce failed", e)
                  }
              }

              /** -Xms for the game JVM: normally equal to -Xmx (upstream behaviour); capped in Low-RAM mode. */
              @JvmStatic
              fun initialHeapMb(maxMb: Int): Int =
