          def c_lines(text: str) -> str:
              """Turn a C snippet into the concatenated Python string literal form used by replace_once."""
              return "".join(line + "\n" for line in text.strip("\n").split("\n"))


          # Which CPU core presents the frames (counted once per frame on the render thread), plus an optional
          # switch that pins the render thread to the fast cores. Raw syscalls are used on purpose: they need no
          # _GNU_SOURCE / API-level guards (sched_getcpu needs API 29).
          LUMEN_CORES_C = c_lines("""
          // LUMEN-CORES-BEGIN
          // Lumen: which CPU core presents the frames, and an optional pin of the render thread to the fast cores.
          #include <sys/syscall.h>
          #include <dirent.h>
          #ifndef LUMEN_CPU_ROOT
          #define LUMEN_CPU_ROOT "/sys/devices/system/cpu"
          #endif
          #if defined(__NR_getcpu) && defined(__NR_sched_getaffinity) && defined(__NR_sched_setaffinity) && defined(__NR_gettid)
          #define LUMEN_CORES 1
          #define LUMEN_MASK_WORDS 16
          #define LUMEN_BITS ((int) (8 * sizeof(unsigned long)))  /* 32 on armeabi-v7a, 64 on arm64-v8a */
          static unsigned long lumenBigMask = 0;   // cores whose max clock is above the slowest core's (0 = unknown / all equal)
          static unsigned long lumenFullMask = 0;  // affinity the render thread had before any pinning
          static int lumenRenderTid = 0;
          static int lumenCoreInit = 0;
          static int lumenPinState = 0;            // 0 = not requested, 1 = render thread pinned, 2 = requested but not possible
          static int lumenFramesBig = 0;
          static int lumenFramesLittle = 0;

          static long lumenReadMaxFreq(int cpu) {
              char path[160];
              char buf[32];
              snprintf(path, sizeof(path), LUMEN_CPU_ROOT "/cpu%d/cpufreq/cpuinfo_max_freq", cpu);
              FILE *f = fopen(path, "r");
              if (f == NULL) return -1;
              long v = -1;
              if (fgets(buf, sizeof(buf), f) != NULL) v = atol(buf);
              fclose(f);
              return v;
          }

          static void lumenInitCores(void) {
              long freq[64];
              int n = 0;
              long minF = 0, maxF = 0;
              while (n < 64) {
                  long f = lumenReadMaxFreq(n);
                  if (f <= 0) break;
                  freq[n] = f;
                  if (n == 0 || f < minF) minF = f;
                  if (f > maxF) maxF = f;
                  n++;
              }
              if (n >= 2 && maxF > minF) {
                  for (int i = 0; i < n && i < LUMEN_BITS; i++) {
                      if (freq[i] > minF) lumenBigMask |= 1UL << i;
                  }
              }
              unsigned long cur[LUMEN_MASK_WORDS];
              memset(cur, 0, sizeof(cur));
              long got = syscall(__NR_sched_getaffinity, 0, sizeof(cur), cur);
              lumenFullMask = (got > 0 && cur[0] != 0) ? cur[0] : ((n > 0 && n < LUMEN_BITS) ? ((1UL << n) - 1UL) : ~0UL);
              lumenRenderTid = (int) syscall(__NR_gettid);
              const char *pin = getenv("LUMEN_RENDER_PIN");
              if (pin != NULL && pin[0] == '1') {
                  unsigned long want = lumenBigMask & lumenFullMask;
                  lumenPinState = 2;
                  if (want != 0) {
                      unsigned long set[LUMEN_MASK_WORDS];
                      memset(set, 0, sizeof(set));
                      set[0] = want;
                      if (syscall(__NR_sched_setaffinity, 0, sizeof(set), set) == 0) lumenPinState = 1;
                  }
              }
          }

          // Called once per presented frame, on the render thread (the thread that calls the swap function).
          static void lumenCountFrameCore(void) {
              if (!lumenCoreInit) {
                  lumenCoreInit = 1;
                  lumenInitCores();
              }
              if (lumenBigMask == 0) return;
              unsigned int cpu = 0;
              if (syscall(__NR_getcpu, &cpu, NULL, NULL) != 0 || cpu >= (unsigned int) LUMEN_BITS) return;
              if ((lumenBigMask >> cpu) & 1UL) __atomic_fetch_add(&lumenFramesBig, 1, __ATOMIC_RELAXED);
              else __atomic_fetch_add(&lumenFramesLittle, 1, __ATOMIC_RELAXED);
          }

          // A thread started by the pinned render thread inherits its affinity. Give every other thread that
          // carries exactly the "fast cores only" mask the full mask back, so only the render thread stays pinned.
          static int lumenSweepAffinity(void) {
              if (lumenPinState != 1) return 0;
              unsigned long bigOnly = lumenBigMask & lumenFullMask;
              DIR *d = opendir("/proc/self/task");
              if (d == NULL) return 0;
              int fixed = 0;
              struct dirent *e;
              while ((e = readdir(d)) != NULL) {
                  int tid = atoi(e->d_name);
                  if (tid <= 0 || tid == lumenRenderTid) continue;
                  unsigned long cur[LUMEN_MASK_WORDS];
                  memset(cur, 0, sizeof(cur));
                  long got = syscall(__NR_sched_getaffinity, tid, sizeof(cur), cur);
                  if (got <= 0 || cur[0] != bigOnly) continue;
                  unsigned long set[LUMEN_MASK_WORDS];
                  memset(set, 0, sizeof(set));
                  set[0] = lumenFullMask;
                  if (syscall(__NR_sched_setaffinity, tid, sizeof(set), set) == 0) fixed++;
              }
              closedir(d);
              return fixed;
          }
          #else
          static void lumenCountFrameCore(void) {}
          #endif
          // LUMEN-CORES-END
          """)

          LUMEN_CORES_JNI = c_lines("""
          // Lumen: frames presented on fast / slow cores since the last call, packed (fast << 32) | slow; -1 = unknown.
          EXTERNAL_API JNIEXPORT jlong JNICALL
          Java_org_lwjgl_glfw_CallbackBridge_getRenderCoreStats(JNIEnv *env, jclass clazz) {
          #ifdef LUMEN_CORES
              if (lumenBigMask == 0) return -1;
              int big = __atomic_exchange_n(&lumenFramesBig, 0, __ATOMIC_RELAXED);
              int little = __atomic_exchange_n(&lumenFramesLittle, 0, __ATOMIC_RELAXED);
              return ((jlong) (unsigned int) big << 32) | (jlong) (unsigned int) little;
          #else
              return -1;
          #endif
          }

          // Lumen: resets the affinity of child threads that inherited the render thread's pin; returns how many.
          EXTERNAL_API JNIEXPORT jint JNICALL
          Java_org_lwjgl_glfw_CallbackBridge_sweepRenderAffinity(JNIEnv *env, jclass clazz) {
          #ifdef LUMEN_CORES
              return lumenSweepAffinity();
          #else
              return 0;
          #endif
          }

          // Lumen: fast-core mask (low 48 bits) and pin state (bits 56..57); -1 when unsupported.
          EXTERNAL_API JNIEXPORT jlong JNICALL
          Java_org_lwjgl_glfw_CallbackBridge_getRenderCoreInfo(JNIEnv *env, jclass clazz) {
          #ifdef LUMEN_CORES
              return (jlong) ((unsigned long long) lumenBigMask & 0xFFFFFFFFFFFFULL) | ((jlong) lumenPinState << 56);
          #else
              return -1;
          #endif
          }
          """)

          # Optional frame limiter. The pacing logic is in the Rust library (d6300_limit_frame); this C code only
          # finds it with dlsym and calls it once per presented frame, and only while the game runs with swap
          # interval 0 (V-Sync off): with V-Sync on the swap already waits for the display, and an extra sleep
          # aimed at the same refresh rate could make frames miss the display deadline.
          LUMEN_PACE_C = c_lines("""
          // LUMEN-PACE-BEGIN
          // Lumen: optional frame limiter (the pacing logic is d6300_limit_frame in the Rust library libd6300core.so).
          static int lumenCapFps = -1;          // -1 = env not read yet, 0 = off
          static int lumenSwapInterval = 1;     // last swap interval the game asked for (forced V-Sync counts as 1)
          static int lumenPaceLibMissing = 0;
          typedef void (*lumenLimitFn)(int);
          static lumenLimitFn lumenLimit = NULL;

          static void lumenPaceInit(void) {
              const char *cap = getenv("LUMEN_FPS_CAP");
              lumenCapFps = 0;
              if (cap != NULL) {
                  int v = atoi(cap);
                  if (v >= 10 && v <= 1000) lumenCapFps = v;
              }
              if (lumenCapFps == 0) return;
              void *h = dlopen("libd6300core.so", RTLD_NOW | RTLD_NOLOAD);
              if (h == NULL) h = dlopen("libd6300core.so", RTLD_NOW);
              if (h != NULL) lumenLimit = (lumenLimitFn) dlsym(h, "d6300_limit_frame");
              if (lumenLimit == NULL) lumenPaceLibMissing = 1;
          }

          // Called once per presented frame, on the render thread, after the buffer swap.
          static void lumenPaceFrame(void) {
              if (lumenCapFps < 0) lumenPaceInit();
              if (lumenCapFps == 0 || lumenLimit == NULL) return;
              if (__atomic_load_n(&lumenSwapInterval, __ATOMIC_RELAXED) != 0) return;
              lumenLimit(lumenCapFps);
          }
          // LUMEN-PACE-END
          """)

          LUMEN_PACE_JNI = c_lines("""
          // Lumen: limiter state for the stability report. (state << 16) | cap fps.
          // state 0 = off, 1 = active, 2 = Rust library or symbol missing, 3 = paused because V-Sync is on.
          EXTERNAL_API JNIEXPORT jint JNICALL
          Java_org_lwjgl_glfw_CallbackBridge_getRenderPaceInfo(JNIEnv *env, jclass clazz) {
              if (lumenCapFps < 0) return 0;
              int state = 0;
              if (lumenCapFps > 0) {
                  if (lumenLimit == NULL) state = 2;
                  else if (__atomic_load_n(&lumenSwapInterval, __ATOMIC_RELAXED) != 0) state = 3;
                  else state = 1;
              }
              return (jint) ((state << 16) | (lumenCapFps & 0xFFFF));
          }
          """)

          # 8b. Native frame-gap counter: the existing fps counter only changes when a frame is presented, so during a
          #     freeze it keeps showing the last value. The gap (time between two presented frames) shows real freezes.
          egl = MODULE / "src/main/jni/egl_bridge.c"

          replace_once(
              egl,
              "EXTERNAL_API void pojavSwapBuffers() {\n"
              "    calculateFPS();\n",
              LUMEN_PACE_C +
              "\n"
              "EXTERNAL_API void pojavSwapBuffers() {\n"
              "    calculateFPS();\n",
          )
          replace_once(
              egl,
              "        virglSwapBuffers();\n"
              "    }\n"
              "\n"
              "}\n",
              "        virglSwapBuffers();\n"
              "    }\n"
              "\n"
              "    lumenPaceFrame();\n"
              "}\n",
          )
          replace_once(
              egl,
              "EXTERNAL_API void pojavSwapInterval(int interval) {\n",
              "EXTERNAL_API void pojavSwapInterval(int interval) {\n"
              "    __atomic_store_n(&lumenSwapInterval, pojav_environ->force_vsync ? 1 : interval, __ATOMIC_RELAXED);\n",
          )
          replace_once(
              egl,
              "static int frameCount = 0;\n"
              "static int fps = 0;\n"
              "static time_t lastTime = 0;\n"
              "\n"
              "void calculateFPS() {\n"
              "    frameCount++;\n",
              "static int frameCount = 0;\n"
              "static int fps = 0;\n"
              "static time_t lastTime = 0;\n"
              "// Lumen: longest time between two presented frames, read (and reset) once per second by the stability monitor.\n"
              "static long long lumenLastFrameNs = 0;\n"
              "static int lumenMaxGapMs = 0;\n"
              "\n"
              "static long long lumenNowNs(void) {\n"
              "    struct timespec ts;\n"
              "    clock_gettime(CLOCK_MONOTONIC, &ts);\n"
              "    return (long long) ts.tv_sec * 1000000000LL + (long long) ts.tv_nsec;\n"
              "}\n"
              "\n"
              + LUMEN_CORES_C +
              "\n"
              "void calculateFPS() {\n"
              "    long long lumenNow = lumenNowNs();\n"
              "    long long lumenLast = __atomic_load_n(&lumenLastFrameNs, __ATOMIC_RELAXED);\n"
              "    if (lumenLast != 0) {\n"
              "        long long gapMs = (lumenNow - lumenLast) / 1000000LL;\n"
              "        if (gapMs > 600000LL) gapMs = 600000LL;\n"
              "        if ((int) gapMs > __atomic_load_n(&lumenMaxGapMs, __ATOMIC_RELAXED)) {\n"
              "            __atomic_store_n(&lumenMaxGapMs, (int) gapMs, __ATOMIC_RELAXED);\n"
              "        }\n"
              "    }\n"
              "    __atomic_store_n(&lumenLastFrameNs, lumenNow, __ATOMIC_RELAXED);\n"
              "    lumenCountFrameCore();\n"
              "\n"
              "    frameCount++;\n",
          )
          replace_once(
              egl,
              "EXTERNAL_API JNIEXPORT jint JNICALL\n"
              "Java_org_lwjgl_glfw_CallbackBridge_getCurrentFps(JNIEnv *env, jclass clazz) {\n"
              "    return fps;\n"
              "}\n",
              "EXTERNAL_API JNIEXPORT jint JNICALL\n"
              "Java_org_lwjgl_glfw_CallbackBridge_getCurrentFps(JNIEnv *env, jclass clazz) {\n"
              "    return fps;\n"
              "}\n"
              "\n"
              "// Lumen: longest frame gap in ms since the last call (includes a gap that is still open), then resets.\n"
              "EXTERNAL_API JNIEXPORT jint JNICALL\n"
              "Java_org_lwjgl_glfw_CallbackBridge_getMaxFrameGapMs(JNIEnv *env, jclass clazz) {\n"
              "    long long last = __atomic_load_n(&lumenLastFrameNs, __ATOMIC_RELAXED);\n"
              "    int open = 0;\n"
              "    if (last != 0) {\n"
              "        long long g = (lumenNowNs() - last) / 1000000LL;\n"
              "        open = (int) (g > 600000LL ? 600000LL : g);\n"
              "    }\n"
              "    int closed = __atomic_exchange_n(&lumenMaxGapMs, 0, __ATOMIC_RELAXED);\n"
              "    return open > closed ? open : closed;\n"
              "}\n"
              + LUMEN_CORES_JNI
              + LUMEN_PACE_JNI,
          )
          replace_once(
              JAVA / "org/lwjgl/glfw/CallbackBridge.java",
              "    @Keep public static native int getCurrentFps();\n",
              "    @Keep public static native int getCurrentFps();\n"
              "    @Keep public static native int getMaxFrameGapMs();\n"
              "    @Keep public static native long getRenderCoreStats();\n"
              "    @Keep public static native int sweepRenderAffinity();\n"
              "    @Keep public static native long getRenderCoreInfo();\n"
              "    @Keep public static native int getRenderPaceInfo();\n",
          )

          # 9. One APK for arm32 + arm64 (-Darch=arm+arm64) -------------------------------------------------
          # Upstream's -Darch switch builds one ABI ("arm", "arm64", "x86", "x86_64") or everything ("all", default).
          # "arm+arm64" is added: no ABI split (so ONE apk), native libraries limited to armeabi-v7a + arm64-v8a through
          # ndk.abiFilters, and the bundled Java runtimes pruned to the arm and arm64 archives (plus universal).
          gradle = MODULE / "build.gradle.kts"
          replace_once(
              gradle,
              'if (arch != "all" && it.name != "version" && !it.name.contains("universal") && it.name != "bin-${arch}.tar.xz") {',
              'if (arch != "all" && it.name != "version" && !it.name.contains("universal") && !arch.split("+").any { a -> it.name == "bin-${a}.tar.xz" }) {',
          )
          replace_once(
              gradle,
              '        val arch = System.getProperty("arch", "all")\n        if (arch != "all") {\n            abi {',
              '        val arch = System.getProperty("arch", "all")\n        if (arch != "all" && !arch.contains("+")) {\n            abi {',
          )
          replace_once(
              gradle,
              '        manifestPlaceholders["launcher_name"] = launcherAPPName\n    }\n',
              '        manifestPlaceholders["launcher_name"] = launcherAPPName\n'
              '        val lumenArch = System.getProperty("arch", "all")\n'
              '        if (lumenArch.contains("+")) {\n'
              '            ndk {\n'
              '                lumenArch.split("+").forEach { a ->\n'
              '                    when (a) {\n'
              '                        "arm" -> abiFilters.add("armeabi-v7a")\n'
              '                        "arm64" -> abiFilters.add("arm64-v8a")\n'
              '                        "x86" -> abiFilters.add("x86")\n'
              '                        "x86_64" -> abiFilters.add("x86_64")\n'
              '                        else -> {}\n'
              '                    }\n'
              '                }\n'
              '            }\n'
              '        }\n'
              '    }\n',
          )

          # 10. Credit: "Made by Kryox" on the About page (upstream credits stay) ---------------------------------
          about = RES / "layout/fragment_about_info_page.xml"
          replace_once(
              about,
              '                <TextView\n'
