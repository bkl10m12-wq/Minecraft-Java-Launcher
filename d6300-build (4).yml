          JNIEXPORT jboolean JNICALL
          Java_org_lwjgl_glfw_CallbackBridge_nativeNotifyLauncher(JNIEnv *env, __attribute__((unused)) jclass clazz,
                                                                  jint type, jintArray action) {
              TRY_ATTACH_ENV(dvm_env, pojav_environ->dalvikJavaVMPtr, "nativeNotifyLauncher failed!\n", return JNI_FALSE;);
              if (pojav_environ->bridgeClazz == NULL || pojav_environ->method_notifyLauncher == NULL) {
                  LOG_TO_E("<%s> %s", "LumenSDL", "nativeNotifyLauncher: launcher side notifyLauncher() is not resolved");
                  return JNI_FALSE;
              }
              jintArray converted = convertIntArrayJVM(env, dvm_env, action);
              jboolean result = (*dvm_env)->CallStaticBooleanMethod(dvm_env, pojav_environ->bridgeClazz,
                                                                    pojav_environ->method_notifyLauncher, type, converted);
              if ((*dvm_env)->ExceptionCheck(dvm_env)) {
                  (*dvm_env)->ExceptionDescribe(dvm_env);
                  (*dvm_env)->ExceptionClear(dvm_env);
                  return JNI_FALSE;
              }
              return result;
          }

          // ---------------------------------------------------------------------------------------------
          // Lazy GLFW bridge for the LWJGL 3.4.1 GLFW class. The old LWJGL 3.3.x jar is initialised eagerly
          // from JNI_OnLoad; the 3.4.1 jar calls this from GLFW.<clinit>. We must not FindClass() here (that would
          // re-enter the class initialiser), the class is handed to us as `clazz`.
          // ---------------------------------------------------------------------------------------------
          JNIEXPORT void JNICALL
          Java_org_lwjgl_glfw_GLFW_nativeInitializeGLFWNativeBridge(JNIEnv *env, jclass clazz) {
              if (pojav_environ->vmGlfwClass != NULL) return;

              jmethodID setAttrib = (*env)->GetStaticMethodID(env, clazz, "glfwSetWindowAttrib", "(JII)V");
              if ((*env)->ExceptionCheck(env)) (*env)->ExceptionClear(env);
              // 3.4.1 signature is (J)V; the 3.3.x bridge used (JII)V. Only one of them exists.
              jmethodID sizeChanged = (*env)->GetStaticMethodID(env, clazz, "internalWindowSizeChanged", "(J)V");
              if ((*env)->ExceptionCheck(env)) (*env)->ExceptionClear(env);
              jfieldID keyField = (*env)->GetStaticFieldID(env, clazz, "keyDownBuffer", "Ljava/nio/ByteBuffer;");
              if ((*env)->ExceptionCheck(env)) (*env)->ExceptionClear(env);
              jfieldID mouseField = (*env)->GetStaticFieldID(env, clazz, "mouseDownBuffer", "Ljava/nio/ByteBuffer;");
              if ((*env)->ExceptionCheck(env)) (*env)->ExceptionClear(env);

              jbyte *keyBuf = NULL;
              jbyte *mouseBuf = NULL;
              if (keyField != NULL) {
                  jobject o = (*env)->GetStaticObjectField(env, clazz, keyField);
                  if (o != NULL) {
                      keyBuf = (*env)->GetDirectBufferAddress(env, o);
                      (*env)->DeleteLocalRef(env, o);
                  }
              }
              if (mouseField != NULL) {
                  jobject o = (*env)->GetStaticObjectField(env, clazz, mouseField);
                  if (o != NULL) {
                      mouseBuf = (*env)->GetDirectBufferAddress(env, o);
                      (*env)->DeleteLocalRef(env, o);
                  }
              }

              pojav_environ->method_glftSetWindowAttrib = setAttrib;
              pojav_environ->method_internalWindowSizeChanged = sizeChanged;
              pojav_environ->keyDownBuffer = keyBuf;
              pojav_environ->mouseDownBuffer = mouseBuf;
              pojav_environ->vmGlfwClass = (*env)->NewGlobalRef(env, clazz);
              LOG_TO_I("<%s> %s", "LumenSDL", "GLFW bridge initialised lazily (LWJGL 3.4.x)");
          }

