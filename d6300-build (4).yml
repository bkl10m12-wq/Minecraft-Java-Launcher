          cat > ZalithLauncher/src/main/java/com/movtery/zalithlauncher/feature/stability/StabilityMonitor.kt <<'D6300_EOF'
          package com.movtery.zalithlauncher.feature.stability

          import android.content.Context
          import android.os.Build
          import android.os.Handler
          import android.os.Looper
          import android.os.PowerManager
          import android.util.Log
          import android.widget.Toast
          import org.lwjgl.glfw.CallbackBridge
          import java.io.File
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale

          /**
           * Samples the game's FPS counter once per second while a game is running and writes a
           * stability report (average, worst-5% average, swing, drops, time in the 69-90 fps band).
           *
           * v2 also records WHY fps collapses, using only files/APIs an app may read:
           *  - memory: MemAvailable (system), VmRSS and VmSwap of this process (swap = zram/virtual RAM use)
           *  - thermal status (PowerManager, Android 10+)
           *  - which threads burn CPU (/proc/self/task/<tid>/stat; the game JVM runs inside this process)
           *  - how long fps stayed at or below 5 (stall time)
           *  - (v3) storage reads, anon/file RAM split, and the CPU core (fast A76 vs slow A55) the render thread
           *    presented its frames from, per second, plus the cluster clocks
           * Values that the phone does not allow reading show up as n/a.
           *
           * Files go to <app external files dir>/stability/session_<time>.txt and .csv and are
           * rewritten every [SAVE_EVERY] samples, so data survives if the process is killed.
           * The FPS counter itself updates once per second (see calculateFPS in egl_bridge.c), so this
           * measures per-second fps, not individual frame times.
           */
          class StabilityMonitor(context: Context) {
              private val appContext: Context = context.applicationContext
              private val samples = ArrayList<Int>()
              private val sysSamples = ArrayList<LongArray>() // [availMb, rssMb, swapMb, thermal] per fps sample

              @Volatile
              private var running = false
              private var worker: Thread? = null
              private var nativeOk: Boolean = NativeStability.available
              private var sweepOk = true
              private val sessionName: String =
                  "session_" + SimpleDateFormat("yyyyMMdd_HHmmss", Locale.US).format(Date())
              private val startedAtMs: Long = System.currentTimeMillis()

              @Volatile
              private var firstFrameSeconds: Long = -1L

              // per-thread CPU accounting (ticks of /proc/self/task/<tid>/stat)
              private val prevTicks = HashMap<String, Long>()
              private val cpuByName = HashMap<String, Long>()
              private var totalTicks = 0L
              private var threadSampleSeconds = 0L

              // RSS / swap peak of every process of this app (the launcher UI process stays alive while the game runs)
              private val ownProcMax = HashMap<String, LongArray>() // name -> [max RSS MB, max swap MB]

              fun start() {
                  if (running) return
                  running = true
                  if (nativeOk) {
                      try {
                          NativeStability.nativeReset()
                      } catch (t: Throwable) {
                          nativeOk = false
                      }
                  }
                  val t = Thread({ loop() }, "d6300-stability")
                  t.isDaemon = true
                  worker = t
                  t.start()
              }

              fun stop() {
                  if (!running) return
                  running = false
                  worker?.interrupt()
                  val summary = saveReport()
                  if (summary != null) {
                      Log.i(TAG, summary)
                      Handler(Looper.getMainLooper()).post {
                          try {
                              Toast.makeText(appContext, summary, Toast.LENGTH_LONG).show()
                          } catch (t: Throwable) {
                              // best effort only
                          }
                      }
                  }
              }

              private fun loop() {
                  var warmup = WARMUP_SECONDS
                  var started = false
                  var sinceSave = 0
                  var elapsed = 0L
                  while (running) {
                      try {
                          Thread.sleep(1000L)
                      } catch (e: InterruptedException) {
                          break
                      }
                      elapsed++
                      if (elapsed % THREAD_SAMPLE_EVERY == 0L) sampleThreads()
                      if (elapsed % OWN_PROC_EVERY == 0L) sampleOwnProcesses()
                      if (sweepOk) {
                          try {
                              CallbackBridge.sweepRenderAffinity() // only does something while the render thread is pinned
                          } catch (t: Throwable) {
                              sweepOk = false
                          }
                      }
                      val fps = try {
                          CallbackBridge.getCurrentFps()
                      } catch (t: Throwable) {
                          0
                      }
                      if (!started) {
                          if (fps <= 0) continue
                          started = true
                          firstFrameSeconds = (System.currentTimeMillis() - startedAtMs) / 1000L
                      }
                      val sys = readSystemSample() // also during warm-up, so the counters never carry old totals
                      if (warmup > 0) {
                          warmup--
                          continue
                      }
                      synchronized(samples) {
                          samples.add(fps)
                          sysSamples.add(sys)
                      }
                      if (nativeOk) {
                          try {
                              NativeStability.nativePush(fps)
                          } catch (t: Throwable) {
                              nativeOk = false
                          }
                      }
                      sinceSave++
                      if (sinceSave >= SAVE_EVERY) {
                          sinceSave = 0
                          saveReport()
                      }
                  }
              }

              // ---- diagnostics -------------------------------------------------------------------

              /** Reads "<key>   123 kB" style lines; returns kB or -1 when unreadable. */
              private fun readKb(path: String, key: String): Long {
                  return try {
                      File(path).useLines { lines ->
                          var found = -1L
                          for (line in lines) {
                              if (line.startsWith(key)) {
                                  found = line.substring(key.length).trim().split(" ")[0].toLongOrNull() ?: -1L
                                  break
                              }
                          }
                          found
                      }
                  } catch (t: Throwable) {
                      -1L
                  }
              }

              private fun kbToMb(kb: Long): Long = if (kb < 0L) -1L else kb / 1024L

              private fun thermalStatus(): Long {
                  return try {
                      if (Build.VERSION.SDK_INT >= 29) {
                          val pm = appContext.getSystemService(Context.POWER_SERVICE) as PowerManager
                          pm.currentThermalStatus.toLong()
                      } else {
                          -1L
                      }
                  } catch (t: Throwable) {
                      -1L
                  }
              }

              private var prevMajflt = -1L
              private var prevReadBytes = -1L
              private var prevWriteBytes = -1L
              private var slowCpu = -2
              private var fastCpu = -2

              /** Value of a "key: 123" line of /proc/self/io (bytes); -1 when unreadable (kernel without I/O accounting). */
              private fun readIoBytes(key: String): Long {
                  return try {
                      File("/proc/self/io").useLines { lines ->
                          var found = -1L
                          for (line in lines) {
                              if (line.startsWith(key)) {
                                  found = line.substring(key.length).trim().toLongOrNull() ?: -1L
                                  break
                              }
                          }
                          found
                      }
                  } catch (t: Throwable) {
                      -1L
                  }
              }

              /** One slow-core and one fast-core index (by cpuinfo_max_freq); -1 when all cores look the same or are unreadable. */
              private fun initCpuIndexes() {
                  if (slowCpu != -2) return
                  slowCpu = -1
                  fastCpu = -1
                  try {
                      val freqs = ArrayList<Long>()
                      var cpu = 0
                      while (cpu < 16) {
                          val file = File("/sys/devices/system/cpu/cpu$cpu/cpufreq/cpuinfo_max_freq")
                          if (!file.canRead()) break
                          freqs.add(file.readText().trim().toLong())
                          cpu++
                      }
                      var mn = Long.MAX_VALUE
                      var mx = 0L
                      for (f in freqs) {
                          if (f < mn) mn = f
                          if (f > mx) mx = f
                      }
                      if (freqs.size >= 2 && mx > mn) {
                          slowCpu = freqs.indexOf(mn)
                          fastCpu = freqs.indexOf(mx)
                      }
                  } catch (t: Throwable) {
                      // diagnostics only
                  }
              }

              /** Current clock of one core in MHz (scaling_cur_freq); -1 when the phone does not allow reading it. */
              private fun curMhz(cpu: Int): Long {
                  if (cpu < 0) return -1L
                  return try {
                      File("/sys/devices/system/cpu/cpu$cpu/cpufreq/scaling_cur_freq").readText().trim().toLong() / 1000L
                  } catch (t: Throwable) {
                      -1L
                  }
              }

              /** Process-wide major page faults so far (field 12 of /proc/self/stat); -1 when unreadable. */
              private fun readMajorFaults(): Long {
                  return try {
                      val text = File("/proc/self/stat").readText()
                      val close = text.lastIndexOf(')')
                      if (close < 0 || close + 2 > text.length) {
                          -1L
                      } else {
                          // after ") ": state is field 3 -> index 0, so majflt (field 12) is index 9
                          text.substring(close + 2).split(" ").getOrNull(9)?.toLongOrNull() ?: -1L
                      }
                  } catch (t: Throwable) {
                      -1L
                  }
              }

              /**
               * [availMb, rssMb, swapMb, thermal, majorFaultsThisSecond, longestFrameGapMs,
               *  storageReadKb, storageWriteKb, rssAnonMb, rssFileMb, renderFastCorePct, fastCoreMhz, slowCoreMhz,
               *  panelHz, limiterFrames, limiterSlept, limiterLate, limiterOversleepAvgUs].
               * The frame gap is the longest time between two presented frames since the last call (native counter),
               * so it shows real freezes; the fps counter alone keeps its old value while no frame is presented.
               * renderFastCorePct = share of frames this second that were presented from a fast (A76-class) core.
               */
              private fun readSystemSample(): LongArray {
                  val avail = kbToMb(readKb("/proc/meminfo", "MemAvailable:"))
                  val rss = kbToMb(readKb("/proc/self/status", "VmRSS:"))
                  val swap = kbToMb(readKb("/proc/self/status", "VmSwap:"))
                  val faults = readMajorFaults()
                  val faultDelta = if (faults >= 0L && prevMajflt >= 0L && faults >= prevMajflt) faults - prevMajflt else -1L
                  prevMajflt = faults
                  val gap = try {
                      CallbackBridge.getMaxFrameGapMs().toLong()
                  } catch (t: Throwable) {
                      -1L
                  }
                  val readB = readIoBytes("read_bytes:")
                  val writeB = readIoBytes("write_bytes:")
                  val readDeltaKb = if (readB >= 0L && prevReadBytes >= 0L && readB >= prevReadBytes) (readB - prevReadBytes) / 1024L else -1L
                  val writeDeltaKb = if (writeB >= 0L && prevWriteBytes >= 0L && writeB >= prevWriteBytes) (writeB - prevWriteBytes) / 1024L else -1L
                  prevReadBytes = readB
                  prevWriteBytes = writeB
                  val anon = kbToMb(readKb("/proc/self/status", "RssAnon:"))
                  val fileMb = kbToMb(readKb("/proc/self/status", "RssFile:"))
                  var fastPct = -1L
                  try {
                      val packed = CallbackBridge.getRenderCoreStats()
                      if (packed >= 0L) {
                          val big = packed ushr 32
                          val little = packed and 0xFFFFFFFFL
                          if (big + little > 0L) fastPct = (big * 100L + (big + little) / 2L) / (big + little)
                      }
                  } catch (t: Throwable) {
                      fastPct = -1L
                  }
                  initCpuIndexes()
                  val hzRaw = try {
                      com.movtery.zalithlauncher.feature.preset.PerformancePreset.currentPanelHz(appContext)
                  } catch (t: Throwable) {
                      -1f
                  }
                  val panelHz = if (hzRaw < 0f) -1L else Math.round(hzRaw).toLong()
                  val capFrames = NativeStability.limiterStat(NativeStability.L_SEEN).toLong()
                  val capSlept = NativeStability.limiterStat(NativeStability.L_SLEPT).toLong()
                  val capLate = NativeStability.limiterStat(NativeStability.L_LATE).toLong()
                  val capOver = NativeStability.limiterStat(NativeStability.L_OVERSLEEP_US).toLong()
                  val capOverAvg = if (capSlept > 0L && capOver >= 0L) capOver / capSlept else -1L
                  return longArrayOf(
                      avail, rss, swap, thermalStatus(), faultDelta, gap,
                      readDeltaKb, writeDeltaKb, anon, fileMb, fastPct, curMhz(fastCpu), curMhz(slowCpu),
                      panelHz, capFrames, capSlept, capLate, capOverAvg
                  )
              }

              /** Adds the CPU ticks every thread of this process used since the last call. */
              private fun sampleThreads() {
                  try {
                      val tasks = File("/proc/self/task").listFiles() ?: return
                      for (task in tasks) {
                          val text = runCatching { File(task, "stat").readText() }.getOrNull() ?: continue
                          val open = text.indexOf('(')
                          val close = text.lastIndexOf(')')
                          if (open < 0 || close < open || close + 2 > text.length) continue
                          val name = text.substring(open + 1, close)
                          // after ") ": state(0) ppid(1) ... utime is field 14 -> index 11, stime index 12
                          val rest = text.substring(close + 2).split(" ")
                          val ut = rest.getOrNull(11)?.toLongOrNull() ?: continue
                          val st = rest.getOrNull(12)?.toLongOrNull() ?: continue
                          val ticks = ut + st
                          val before = prevTicks.put(task.name, ticks)
                          if (before != null && ticks >= before) {
                              val delta = ticks - before
                              cpuByName[name] = (cpuByName[name] ?: 0L) + delta
                              totalTicks += delta
                          }
                      }
                      threadSampleSeconds += THREAD_SAMPLE_EVERY
                  } catch (t: Throwable) {
                      // diagnostics only
                  }
              }

              private fun buildDiagnostics(copy: List<Int>, sys: List<LongArray>): String {
                  val sb = StringBuilder("\n--- Diagnostics (kyun fps gira) ---\n")
                  sb.append("First frame after ").append(if (firstFrameSeconds >= 0L) firstFrameSeconds.toString() + " s" else "n/a")
                      .append(" (splash screen, world load nahi)\n")

                  var lowSeconds = 0
                  var longest = 0
                  var streak = 0
                  for (v in copy) {
                      if (v <= 5) {
                          lowSeconds++
                          streak++
                          if (streak > longest) longest = streak
                      } else {
                          streak = 0
                      }
                  }
                  sb.append("Seconds with fps <= 5: ").append(lowSeconds).append(" of ").append(copy.size)
                      .append(", longest stall ").append(longest).append(" s\n")

                  var minAvail = Long.MAX_VALUE
                  var maxRss = -1L
                  var maxSwap = -1L
                  var maxThermal = -1L
                  for (s in sys) {
                      if (s[0] >= 0L && s[0] < minAvail) minAvail = s[0]
                      if (s[1] > maxRss) maxRss = s[1]
                      if (s[2] > maxSwap) maxSwap = s[2]
                      if (s[3] > maxThermal) maxThermal = s[3]
                  }
                  sb.append("Lowest free RAM (MemAvailable): ")
                      .append(if (minAvail == Long.MAX_VALUE) "n/a" else minAvail.toString() + " MB").append('\n')
                  sb.append("Game process RAM max (RSS): ").append(if (maxRss >= 0L) maxRss.toString() + " MB" else "n/a")
                      .append(", swapped out max (VmSwap): ").append(if (maxSwap >= 0L) maxSwap.toString() + " MB" else "n/a").append('\n')
                  sb.append(ownProcessesLine())
                  sb.append("Thermal status max (0 none .. 3 severe .. 6 shutdown): ")
                      .append(if (maxThermal >= 0L) maxThermal.toString() else "n/a").append('\n')

                  // Real freezes (frame gap) and whether they coincide with major page faults (swap-in / file reads).
                  var gapKnown = false
                  var longestGap = -1L
                  var freezeSeconds = 0
                  var faultsInFreeze = 0L
                  var freezeFaultSeconds = 0
                  var faultsOther = 0L
                  var otherFaultSeconds = 0
                  var totalFaults = 0L
                  for (s in sys) {
                      val faults = if (s.size > 4) s[4] else -1L
                      val gap = if (s.size > 5) s[5] else -1L
                      if (gap >= 0L) gapKnown = true
                      if (gap > longestGap) longestGap = gap
                      val frozen = gap >= FREEZE_GAP_MS
                      if (frozen) freezeSeconds++
                      if (faults >= 0L) {
                          totalFaults += faults
                          if (frozen) {
                              faultsInFreeze += faults
                              freezeFaultSeconds++
                          } else {
                              faultsOther += faults
                              otherFaultSeconds++
                          }
                      }
                  }
                  if (gapKnown) {
                      sb.append("Freezes (frame gap >= ").append(FREEZE_GAP_MS).append(" ms): ").append(freezeSeconds)
                          .append(" of ").append(sys.size).append(" seconds, longest gap ").append(longestGap).append(" ms\n")
                  } else {
                      sb.append("Frame gap: n/a (native counter not available)\n")
                  }
                  if (freezeFaultSeconds + otherFaultSeconds > 0) {
                      val inFreeze = if (freezeFaultSeconds > 0) faultsInFreeze.toDouble() / freezeFaultSeconds else -1.0
                      val normal = if (otherFaultSeconds > 0) faultsOther.toDouble() / otherFaultSeconds else -1.0
                      sb.append("Major page faults per second: during freezes ").append(if (inFreeze >= 0.0) f1(inFreeze) else "n/a")
                          .append(", normal seconds ").append(if (normal >= 0.0) f1(normal) else "n/a")
                          .append(" (total ").append(totalFaults)
                          .append("). Much higher during freezes = freezes are memory/swap stalls.\n")
                  } else {
                      sb.append("Major page faults: n/a\n")
                  }

                  appendCoreAndIoDiagnostics(sb, copy, sys)
                  appendPacingDiagnostics(sb, copy, sys)

                  if (totalTicks > 0L && threadSampleSeconds > 0L) {
                      val cores = totalTicks / 100.0 / threadSampleSeconds
                      sb.append("Average CPU use by the game process: ").append(f1(cores)).append(" cores of 8\n")
                      sb.append("Top threads by CPU:\n")
                      val top = cpuByName.entries.sortedByDescending { it.value }.take(8)
                      for (e in top) {
                          val pct = e.value * 100.0 / totalTicks
                          sb.append("  ").append(e.key).append(": ").append(f1(pct)).append(" percent\n")
                      }
                  } else {
                      sb.append("Thread CPU: n/a\n")
                  }
                  return sb.toString()
              }

              /** Storage reads, anon/file RAM split, and which cores the render thread ran on in low vs high fps seconds. */
              private fun appendCoreAndIoDiagnostics(sb: StringBuilder, copy: List<Int>, sys: List<LongArray>) {
                  var maxAnon = -1L
                  var maxFile = -1L
                  var readFreezeKb = 0L
                  var readFreezeSec = 0
                  var readOtherKb = 0L
                  var readOtherSec = 0
                  var totalReadKb = 0L
                  var totalFaults = 0L
                  for (s in sys) {
                      if (s.size < 13) continue
                      if (s[8] > maxAnon) maxAnon = s[8]
                      if (s[9] > maxFile) maxFile = s[9]
                      if (s[6] >= 0L) {
                          totalReadKb += s[6]
                          if (s[5] >= FREEZE_GAP_MS) {
                              readFreezeKb += s[6]
                              readFreezeSec++
                          } else {
                              readOtherKb += s[6]
                              readOtherSec++
                          }
                      }
                      if (s[4] > 0L) totalFaults += s[4]
                  }
                  if (maxAnon >= 0L) {
                      sb.append("Game RAM split at peak: anonymous (Java heap etc.) ").append(maxAnon).append(" MB, file-backed ")
                          .append(if (maxFile >= 0L) maxFile.toString() + " MB" else "n/a").append('\n')
                  }
                  if (readFreezeSec + readOtherSec > 0) {
                      sb.append("Storage reads by the game (read_bytes): total ").append(totalReadKb / 1024L).append(" MB; per second during freezes ")
                          .append(if (readFreezeSec > 0) (readFreezeKb / readFreezeSec).toString() + " KB" else "n/a")
                          .append(", normal seconds ").append(if (readOtherSec > 0) (readOtherKb / readOtherSec).toString() + " KB" else "n/a")
                          .append("; page faults x 4 KB = ").append(totalFaults * 4L / 1024L).append(" MB\n")
                  } else {
                      sb.append("Storage reads: n/a (phone does not expose /proc/self/io)\n")
                  }

                  // Which cores presented the frames: render thread on fast cores in low vs high fps seconds.
                  if (copy.size < 10) return
                  val sorted = copy.sorted()
                  val median = sorted[sorted.size / 2]
                  val lowLimit = median * 0.6
                  val highLimit = median * 0.9
                  var lowN = 0
                  var lowFast = 0L
                  var lowFastMhz = 0L
                  var lowFastMhzN = 0
                  var lowSlowMhz = 0L
                  var lowSlowMhzN = 0
                  var highN = 0
                  var highFast = 0L
                  var highFastMhz = 0L
                  var highFastMhzN = 0
                  var highSlowMhz = 0L
                  var highSlowMhzN = 0
                  var allN = 0
                  var allFast = 0L
                  for (i in copy.indices) {
                      val s = if (i < sys.size) sys[i] else continue
                      if (s.size < 13) continue
                      val pct = s[10]
                      if (pct >= 0L) {
                          allN++
                          allFast += pct
                      }
                      val low = copy[i] < lowLimit
                      val high = copy[i] >= highLimit
                      if (low) {
                          if (pct >= 0L) {
                              lowN++
                              lowFast += pct
                          }
                          if (s[11] >= 0L) {
                              lowFastMhz += s[11]
                              lowFastMhzN++
                          }
                          if (s[12] >= 0L) {
                              lowSlowMhz += s[12]
                              lowSlowMhzN++
                          }
                      } else if (high) {
                          if (pct >= 0L) {
                              highN++
                              highFast += pct
                          }
                          if (s[11] >= 0L) {
                              highFastMhz += s[11]
                              highFastMhzN++
                          }
                          if (s[12] >= 0L) {
                              highSlowMhz += s[12]
                              highSlowMhzN++
                          }
                      }
                  }
                  if (allN == 0) {
                      sb.append("Render thread core: n/a (phone has equal cores or native counter missing)\n")
                      return
                  }
                  sb.append("Render thread on fast cores (frames presented from an A76-class core): overall ")
                      .append(allFast / allN).append(" percent; in low-fps seconds (fps < ").append(f0(lowLimit)).append(") ")
                      .append(if (lowN > 0) (lowFast / lowN).toString() + " percent (" + lowN + " s)" else "n/a")
                      .append("; in high-fps seconds (fps >= ").append(f0(highLimit)).append(") ")
                      .append(if (highN > 0) (highFast / highN).toString() + " percent (" + highN + " s)" else "n/a").append('\n')
                  sb.append("Core clocks MHz (fast core / slow core): low-fps seconds ")
                      .append(mhzPair(lowFastMhz, lowFastMhzN, lowSlowMhz, lowSlowMhzN))
                      .append(", high-fps seconds ").append(mhzPair(highFastMhz, highFastMhzN, highSlowMhz, highSlowMhzN)).append('\n')
              }

              private fun mhzPair(fastSum: Long, fastN: Int, slowSum: Long, slowN: Int): String =
                  (if (fastN > 0) (fastSum / fastN).toString() else "n/a") + " / " + (if (slowN > 0) (slowSum / slowN).toString() else "n/a")

              // ---- report ------------------------------------------------------------------------

              @Synchronized
              private fun saveReport(): String? {
                  val snapshot = synchronized(samples) {
                      Pair(ArrayList(samples), ArrayList(sysSamples))
                  }
                  val copy: List<Int> = snapshot.first
                  val sysCopy: List<LongArray> = snapshot.second
                  if (copy.size < MIN_SAMPLES) return null
                  val summary = buildSummary(copy)
                  try {
                      val base = appContext.getExternalFilesDir(null) ?: return summary
                      val dir = File(base, "stability")
                      dir.mkdirs()
                      val header = "Device: " + Build.MODEL + " / " + Build.HARDWARE + " / Android " + Build.VERSION.RELEASE
                      val presetLine = try {
                          com.movtery.zalithlauncher.feature.preset.PerformancePreset.currentLabel()
                      } catch (t: Throwable) {
                          "Preset: unknown"
                      }
                      val diag = try {
                          buildDiagnostics(copy, sysCopy)
                      } catch (t: Throwable) {
                          "\nDiagnostics failed: " + t.javaClass.simpleName + "\n"
                      }
                      File(dir, "$sessionName.txt").writeText(
                          header + "\n" + hardwareLine() + "\n" + presetLine + "\n" + summary + "\n" + diag
                      )
                      val csv = StringBuilder(
                          "second,fps,free_ram_mb,game_rss_mb,game_swap_mb,thermal,major_faults,max_frame_gap_ms," +
                              "read_kb,write_kb,rss_anon_mb,rss_file_mb,render_fast_core_pct,fast_core_mhz,slow_core_mhz," +
                              "display_hz,cap_frames,cap_slept,cap_late,cap_oversleep_avg_us\n"
                      )
                      for (i in copy.indices) {
                          csv.append(i + 1).append(',').append(copy[i])
                          val s = if (i < sysCopy.size) sysCopy[i] else null
                          if (s != null) {
                              for (v in s) csv.append(',').append(v)
                          }
                          csv.append('\n')
                      }
                      File(dir, "$sessionName.csv").writeText(csv.toString())
                  } catch (t: Throwable) {
                      Log.w(TAG, "Could not write stability report", t)
                  }
                  return summary
              }

              private fun buildSummary(copy: List<Int>): String {
                  if (nativeOk) {
                      try {
                          return formatNative(copy.size)
                      } catch (t: Throwable) {
                          nativeOk = false
                      }
                  }
                  return formatFallback(copy)
              }

              private fun f1(x: Double): String = String.format(Locale.US, "%.1f", x)

              /** Facts that explain the numbers: panel refresh rate, CPU core clocks, JVM max heap. Never throws. */
              private fun hardwareLine(): String {
                  val sb = StringBuilder()
                  try {
                      val dm = appContext.getSystemService(Context.DISPLAY_SERVICE) as android.hardware.display.DisplayManager
                      val display = dm.getDisplay(android.view.Display.DEFAULT_DISPLAY)
                      if (display != null) sb.append("Display ").append(f1(display.refreshRate.toDouble())).append(" Hz; ")
                  } catch (t: Throwable) {
                      sb.append("Display n/a; ")
                  }
                  try {
                      val freqs = ArrayList<String>()
                      var cpu = 0
                      while (cpu < 16) {
                          val file = File("/sys/devices/system/cpu/cpu$cpu/cpufreq/cpuinfo_max_freq")
                          if (!file.canRead()) break
                          freqs.add((file.readText().trim().toLong() / 1000L).toString())
                          cpu++
                      }
                      sb.append("CPU max MHz per core: ").append(if (freqs.isEmpty()) "n/a" else freqs.joinToString("/")).append("; ")
                  } catch (t: Throwable) {
                      sb.append("CPU clocks n/a; ")
                  }
                  try {
                      // The real -Xms/-Xmx the game JVM was started with (Runtime.maxMemory() here would only show
                      // the Android app's own 256 MB heap limit, not Minecraft's).
                      sb.append(com.movtery.zalithlauncher.feature.preset.PerformancePreset.heapLine())
                  } catch (t: Throwable) {
                      // best effort only
                  }
                  try {
                      sb.append("; ").append(com.movtery.zalithlauncher.feature.preset.PerformancePreset.gcLogLine())
                  } catch (t: Throwable) {
                      // best effort only
                  }
                  try {
                      val info = CallbackBridge.getRenderCoreInfo()
                      if (info >= 0L) {
                          val mask = info and 0xFFFFFFFFFFFFL
                          val state = (info ushr 56) and 3L
                          sb.append("; fast-core mask 0x").append(java.lang.Long.toHexString(mask)).append(", render pin ")
                              .append(if (state == 1L) "ACTIVE" else if (state == 2L) "requested but not possible" else "not requested")
                      }
                  } catch (t: Throwable) {
                      // best effort only
                  }
                  try {
                      sb.append('\n').append(com.movtery.zalithlauncher.feature.preset.PerformancePreset.refreshLine())
                  } catch (t: Throwable) {
                      // best effort only
                  }
                  sb.append('\n').append(paceLine())
                  sb.append('\n').append(swapLine())
                  return sb.toString()
              }
              private fun f0(x: Double): String = String.format(Locale.US, "%.0f", x)

              /** State of the frame limiter and of the Rust core, as seen by the native render bridge. */
              private fun paceLine(): String {
                  val core = NativeStability.coreVersion()
                  val coreText = if (core > 0) "Rust core v" + core else if (NativeStability.available) "Rust core loaded (old, no limiter)" else "Rust core NOT loaded"
                  return try {
                      val info = CallbackBridge.getRenderPaceInfo()
                      val state = info shr 16
                      val cap = info and 0xFFFF
                      "Frame limiter: " + when (state) {
                          1 -> "ACTIVE at " + cap + " fps"
                          2 -> "requested " + cap + " fps, but the native code could not find the Rust library"
                          3 -> "paused: V-Sync is on (cap " + cap + " fps is only used with V-Sync off)"
                          else -> "off"
                      } + " (" + coreText + ")"
                  } catch (t: Throwable) {
                      "Frame limiter: state n/a (" + coreText + ")"
                  }
              }

              /** Panel refresh rate per second, frames nobody can see, and what the limiter did. */
              private fun appendPacingDiagnostics(sb: StringBuilder, copy: List<Int>, sys: List<LongArray>) {
                  val hzSeconds = java.util.TreeMap<Long, Int>()
                  var withHz = 0
                  var above = 0
                  var frames = 0L
                  var late = 0L
                  var overSum = 0L
                  var overN = 0
                  for (i in sys.indices) {
                      val s = sys[i]
                      if (s.size < 18) continue
                      val hz = s[13]
                      if (hz > 0L) {
                          hzSeconds[hz] = (hzSeconds[hz] ?: 0) + 1
                          if (i < copy.size) {
                              withHz++
                              if (copy[i].toLong() > hz) above++
                          }
                      }
                      if (s[14] > 0L) {
                          frames += s[14]
                          if (s[16] > 0L) late += s[16]
                          if (s[17] >= 0L) {
                              overSum += s[17]
                              overN++
                          }
                      }
                  }
                  if (hzSeconds.isEmpty()) {
                      sb.append("Panel refresh rate: n/a\n")
                  } else {
                      val parts = ArrayList<String>()
                      for (e in hzSeconds.descendingMap().entries) parts.add(e.key.toString() + " Hz for " + e.value + " s")
                      sb.append("Panel refresh rate (mode Android reports): ").append(parts.joinToString(", ")).append('\n')
                      if (withHz > 0) {
                          sb.append("Seconds where the game's fps counter was above the panel rate (extra frames are never shown): ")
                              .append(above).append(" of ").append(withHz).append('\n')
                      }
                  }
                  if (frames > 0L) {
                      sb.append("Frame limiter: ").append(frames).append(" frames passed, ")
                          .append(f0(late * 100.0 / frames)).append(" percent over their time slot (nothing to wait for)")
                      if (overN > 0) sb.append(", average oversleep ").append(overSum / overN).append(" us")
                      sb.append('\n')
                  } else {
                      sb.append("Frame limiter: no frame passed through it (off, V-Sync on, or Rust library missing)\n")
                  }
              }

              /** Peak RSS / swap of all processes of this app, sampled every [OWN_PROC_EVERY] s. */
              private fun sampleOwnProcesses() {
                  try {
                      val list = com.movtery.zalithlauncher.feature.lumen.LumenRam.ownProcesses(appContext)
                      synchronized(ownProcMax) {
                          for (p in list) {
                              val cur = ownProcMax.getOrPut(p.name) { longArrayOf(-1L, -1L) }
                              if (p.rssMb > cur[0]) cur[0] = p.rssMb
                              if (p.swapMb > cur[1]) cur[1] = p.swapMb
                          }
                      }
                  } catch (t: Throwable) {
                      // best effort only
                  }
              }

              private fun ownProcessesLine(): String {
                  val label = "App processes RAM max (RSS, sampled every $OWN_PROC_EVERY s): "
                  val parts = ArrayList<String>()
                  synchronized(ownProcMax) {
                      for (e in ownProcMax.entries.sortedBy { it.key }) {
                          val swap = if (e.value[1] >= 0L) e.value[1].toString() else "?"
                          parts.add(e.key + " " + e.value[0] + " MB (swapped " + swap + " MB)")
                      }
                  }
                  return if (parts.isEmpty()) label + "n/a\n" else label + parts.joinToString(" | ") + "\n"
              }

              /** System swap size from /proc/meminfo plus the device list of /proc/swaps when the phone allows reading it. */
              private fun swapLine(): String {
                  val total = kbToMb(readKb("/proc/meminfo", "SwapTotal:"))
                  val free = kbToMb(readKb("/proc/meminfo", "SwapFree:"))
                  val sb = StringBuilder("System swap: ")
                  sb.append(if (total >= 0L) total.toString() + " MB total, " + (if (free >= 0L) free.toString() else "?") + " MB free" else "n/a")
                  try {
                      val lines = File("/proc/swaps").readLines().drop(1).filter { it.isNotBlank() }
                      if (lines.isNotEmpty()) {
                          sb.append("; devices: ")
                          sb.append(lines.joinToString(" | ") { it.trim().split(Regex("\\s+")).take(3).joinToString(" ") })
                      }
                  } catch (t: Throwable) {
                      sb.append("; /proc/swaps not readable")
                  }
                  return sb.toString()
              }

              private fun formatNative(count: Int): String {
                  val avg = NativeStability.nativeMetric(NativeStability.M_AVG)
                  val median = NativeStability.nativeMetric(NativeStability.M_MEDIAN)
                  val low5 = NativeStability.nativeMetric(NativeStability.M_LOW5)
                  val min = NativeStability.nativeMetric(NativeStability.M_MIN)
                  val max = NativeStability.nativeMetric(NativeStability.M_MAX)
                  val sd = NativeStability.nativeMetric(NativeStability.M_STDEV)
                  val swing = NativeStability.nativeMetric(NativeStability.M_SWING)
                  val band = NativeStability.nativeMetric(NativeStability.M_PCT_IN_BAND)
                  val drops = NativeStability.nativeMetric(NativeStability.M_DROPS)
                  return "Samples: $count s (first $WARMUP_SECONDS s skipped)\n" +
                      "Average " + f1(avg) + " fps, median " + f1(median) + "\n" +
                      "Worst-5% average " + f1(low5) + " fps (min " + f0(min) + ", max " + f0(max) + ")\n" +
                      "Std dev " + f1(sd) + ", swing " + f0(swing) + " fps (p95-p5)\n" +
                      "Time in 69-90 fps band: " + f0(band) + " percent\n" +
                      "Sudden drops: " + f0(drops) + " s"
              }

              private fun formatFallback(copy: List<Int>): String {
                  var sum = 0L
                  var min = Int.MAX_VALUE
                  var max = Int.MIN_VALUE
                  for (v in copy) {
                      sum += v
                      if (v < min) min = v
                      if (v > max) max = v
                  }
                  val avg = sum.toDouble() / copy.size
                  return "Samples: " + copy.size + " s (first $WARMUP_SECONDS s skipped)\n" +
                      "Average " + f1(avg) + " fps (min " + min + ", max " + max + ")\n" +
                      "(Rust core not loaded: basic summary only)"
              }

              private companion object {
                  const val TAG = "D6300Stability"
                  const val WARMUP_SECONDS = 20
                  const val SAVE_EVERY = 30
                  const val MIN_SAMPLES = 30
                  const val THREAD_SAMPLE_EVERY = 3L
                  const val OWN_PROC_EVERY = 15L
                  const val FREEZE_GAP_MS = 250L
              }
          }
