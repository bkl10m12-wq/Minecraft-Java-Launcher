          import com.movtery.zalithlauncher.feature.accounts.AccountUtils.Companion.isNoLoginRequired
          import com.movtery.zalithlauncher.feature.accounts.AccountsManager
          import com.movtery.zalithlauncher.feature.log.Logging
          import com.movtery.zalithlauncher.utils.path.PathManager
          import com.movtery.zalithlauncher.utils.path.UrlManager
          import net.kdt.pojavlaunch.authenticator.listener.DoneListener
          import net.kdt.pojavlaunch.authenticator.listener.ErrorListener
          import net.kdt.pojavlaunch.value.MinecraftAccount
          import okhttp3.MediaType.Companion.toMediaType
          import okhttp3.MultipartBody
          import okhttp3.Request
          import okhttp3.RequestBody.Companion.toRequestBody
          import org.greenrobot.eventbus.EventBus
          import java.io.File
          import java.io.FileOutputStream
          import java.util.zip.ZipEntry
          import java.util.zip.ZipOutputStream

          /**
           * Skin from the launcher: the gallery opens, the picked 64x64 PNG is applied.
           *
           *  - Microsoft account: uploaded to Mojang (POST api.minecraftservices.com/minecraft/profile/skins),
           *    so every server and every game version shows it.
           *  - Local (offline) account: the game has no skin server, so a small resource pack
           *    ("LumenSkin.zip") that replaces the default player skins is generated in the game folder on every
           *    launch and enabled in options.txt. Experimental: it relies on the default skin file paths of
           *    Minecraft 1.19.3+ (stored separately for the wide and slim model) and on options.txt already existing.
           */
          object LumenSkin {
              private const val TAG = "LumenSkin"
              private const val PACK_NAME = "LumenSkin.zip"
              private const val ENDPOINT = "https://api.minecraftservices.com/minecraft/profile/skins"
              private const val MCMETA =
                  "{\"pack\":{\"description\":\"Lumen local skin\",\"pack_format\":46," +
                      "\"supported_formats\":{\"min_inclusive\":1,\"max_inclusive\":999}," +
                      "\"min_format\":1,\"max_format\":999}}"
              private val DEFAULT_SKIN_NAMES = listOf("alex", "ari", "efe", "kai", "makena", "noor", "steve", "sunny", "zuri")

              private fun toast(context: Context, text: String) {
                  Handler(Looper.getMainLooper()).post {
                      try {
                          Toast.makeText(context.applicationContext, text, Toast.LENGTH_LONG).show()
                      } catch (t: Throwable) {
                          // best effort only
                      }
                  }
              }

              private fun skinFile(account: MinecraftAccount) = File(PathManager.DIR_USER_SKIN, account.uniqueUUID + ".png")
              private fun modelFile(account: MinecraftAccount) = File(PathManager.DIR_USER_SKIN, account.uniqueUUID + ".lumen")

              /** Slim (Alex) skins leave the last column of the right arm back face transparent. */
              private fun detectSlim(png: ByteArray): Boolean {
                  val bmp = BitmapFactory.decodeByteArray(png, 0, png.size) ?: return false
                  var slim = true
                  for (y in 20..31) {
                      if (Color.alpha(bmp.getPixel(55, y)) != 0) {
                          slim = false
                          break
                      }
                  }
                  return slim
              }

              @JvmStatic
              fun onSkinPicked(activity: Activity?, uri: Uri?) {
                  if (activity == null || uri == null) return
                  val app = activity.applicationContext
                  Thread {
                      try {
                          val input = app.contentResolver.openInputStream(uri)
                          if (input == null) {
                              toast(app, "Skin file khul nahi payi.")
                              return@Thread
                          }
                          val png = input.use { it.readBytes() }
                          if (png.size > 1_000_000) {
                              toast(app, "File bahut badi hai. Skin PNG chahiye (64x64).")
                              return@Thread
                          }
                          val bounds = BitmapFactory.Options()
                          bounds.inJustDecodeBounds = true
                          BitmapFactory.decodeByteArray(png, 0, png.size, bounds)
                          if (bounds.outWidth != 64 || bounds.outHeight != 64) {
                              toast(
                                  app,
                                  "Skin PNG 64x64 honi chahiye. Tumhari image " + bounds.outWidth + "x" + bounds.outHeight +
                                      " hai (64x32 purani skin ko 64x64 me badalna padega)."
                              )
                              return@Thread
                          }
                          val slim = detectSlim(png)
                          val account = AccountsManager.currentAccount
                          if (account == null) {
                              toast(app, "Pehle account banao / chuno, phir skin lagao.")
                              return@Thread
                          }
                          when {
                              isMicrosoftAccount(account) -> uploadMicrosoft(activity, account, png, slim, true)
                              isNoLoginRequired(account) -> saveLocal(app, account, png, slim)
                              else -> toast(app, "Is account type (third-party login) ke liye skin upload abhi support nahi hai.")
                          }
                      } catch (t: Throwable) {
                          Logging.e(TAG, "Skin pick failed", t)
                          toast(app, "Skin lagane me error: " + t.javaClass.simpleName)
                      }
                  }.start()
              }

              private fun saveLocalCopy(account: MinecraftAccount, png: ByteArray, slim: Boolean) {
                  val dir = PathManager.DIR_USER_SKIN
                  if (!dir.exists()) dir.mkdirs()
                  skinFile(account).writeBytes(png)
                  modelFile(account).writeText(if (slim) "slim" else "classic")
                  Handler(Looper.getMainLooper()).post {
                      EventBus.getDefault().post(AccountUpdateEvent())
                  }
              }

              private fun saveLocal(app: Context, account: MinecraftAccount, png: ByteArray, slim: Boolean) {
                  saveLocalCopy(account, png, slim)
                  toast(
                      app,
                      "Local skin save ho gayi (" + (if (slim) "slim" else "classic") +
                          "). Agle game launch pe lagegi, agar game ne options.txt pehle bana li ho (ek baar game khol chuke ho)."
                  )
              }

              private fun postSkin(token: String, png: ByteArray, slim: Boolean): Int {
                  val body = MultipartBody.Builder()
                      .setType(MultipartBody.FORM)
                      .addFormDataPart("variant", if (slim) "slim" else "classic")
                      .addFormDataPart("file", "skin.png", png.toRequestBody("image/png".toMediaType()))
                      .build()
                  val request = Request.Builder()
                      .url(ENDPOINT)
                      .header("Authorization", "Bearer $token")
                      .post(body)
                      .build()
                  return UrlManager.createOkHttpClient().newCall(request).execute().use { response -> response.code }
              }

              /** Runs on a worker thread. Retries once after refreshing the Microsoft login when the token was rejected. */
              private fun uploadMicrosoft(activity: Activity, account: MinecraftAccount, png: ByteArray, slim: Boolean, firstTry: Boolean) {
                  val app = activity.applicationContext
                  val code = try {
                      postSkin(account.accessToken, png, slim)
                  } catch (t: Throwable) {
                      Logging.e(TAG, "Skin upload failed", t)
                      toast(app, "Internet / upload error: " + t.javaClass.simpleName)
                      return
                  }
                  when {
                      code in 200..299 -> {
                          saveLocalCopy(account, png, slim)
                          toast(app, "Skin Microsoft account pe upload ho gayi (" + (if (slim) "slim" else "classic") + "). Game me rejoin karo.")
                      }
                      (code == 401 || code == 403) && firstTry -> {
                          toast(app, "Login refresh kar raha hoon, phir skin dobara bhejunga...")
                          AccountUtils.microsoftLogin(
                              activity,
                              account,
                              DoneListener { fresh -> Thread { uploadMicrosoft(activity, fresh, png, slim, false) }.start() },
                              ErrorListener { _ -> toast(app, "Microsoft login refresh fail. Account me dobara login karo.") }
                          )
                      }
                      else -> toast(app, "Mojang ne skin reject ki (HTTP $code). Account login dobara karke try karo.")
                  }
              }

              // ---- local (offline) accounts: resource pack ----------------------------------------

              /** Called from LaunchArgs before every launch. Never throws. */
              @JvmStatic
              fun prepareLocalSkinPack(account: MinecraftAccount, gameDir: File) {
                  try {
                      if (!isNoLoginRequired(account)) return
                      val skin = skinFile(account)
                      if (!skin.isFile || !modelFile(account).isFile) return // only skins chosen through Lumen
                      val png = skin.readBytes()
                      val packDir = File(gameDir, "resourcepacks")
                      packDir.mkdirs()
                      ZipOutputStream(FileOutputStream(File(packDir, PACK_NAME))).use { zip ->
                          fun put(path: String, data: ByteArray) {
                              zip.putNextEntry(ZipEntry(path))
                              zip.write(data)
                              zip.closeEntry()
                          }
                          put("pack.mcmeta", MCMETA.toByteArray(Charsets.UTF_8))
                          for (name in DEFAULT_SKIN_NAMES) {
                              put("assets/minecraft/textures/entity/player/wide/$name.png", png)
                              put("assets/minecraft/textures/entity/player/slim/$name.png", png)
                          }
                          // pre-1.19.3 locations
                          put("assets/minecraft/textures/entity/steve.png", png)
                          put("assets/minecraft/textures/entity/alex.png", png)
                      }
                      enableInOptions(gameDir)
                  } catch (t: Throwable) {
                      Logging.e(TAG, "Could not prepare local skin pack", t)
                  }
              }

              private fun enableInOptions(gameDir: File) {
                  val options = File(gameDir, "options.txt")
                  if (!options.isFile) return
                  val entry = "\"file/$PACK_NAME\""
                  val lines = options.readLines().toMutableList()
                  val idx = lines.indexOfFirst { it.startsWith("resourcePacks:") }
                  if (idx < 0) {
                      lines.add("resourcePacks:[\"vanilla\",$entry]")
                  } else {
                      val line = lines[idx]
                      if (line.contains(entry)) return
                      val open = line.indexOf('[')
                      val close = line.lastIndexOf(']')
                      if (open < 0 || close < open) return
                      val inner = line.substring(open + 1, close).trim()
                      lines[idx] = "resourcePacks:[" + (if (inner.isEmpty()) "" else "$inner,") + entry + "]"
                  }
                  options.writeText(lines.joinToString("\n") + "\n")
              }
          }
