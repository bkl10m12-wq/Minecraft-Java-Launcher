          package com.movtery.zalithlauncher.feature.lumen

          import android.app.Activity
          import android.app.ActivityManager
          import android.content.Context
          import android.content.Intent
          import android.provider.Settings
          import android.widget.Toast
          import com.movtery.zalithlauncher.feature.log.Logging
          import com.movtery.zalithlauncher.setting.AllSettings
          import com.movtery.zalithlauncher.ui.dialog.TipDialog
          import net.kdt.pojavlaunch.Tools
          import java.io.File

          /**
           * RAM check for the main menu.
           *
           * What it does: shows the numbers that decide whether the game can stay in RAM (free RAM, swap, the
           * RAM given to the game, what this app's own processes hold) and says plainly what can and cannot be
           * done about it.
           *
           * What it deliberately does NOT do: "clean" other apps. Since Android 14 an app's
           * killBackgroundProcesses() only affects the app's own processes, and apps cannot read other apps'
           * memory at all, so a launcher cannot pull RAM from other apps without root.
           */
          object LumenRam {
              private const val TAG = "LumenRam"

              class ProcMem(val name: String, val rssMb: Long, val swapMb: Long)

              private fun readKb(path: String, key: String): Long {
                  return try {
                      File(path).useLines { lines ->
                          var found = -1L
                          for (line in lines) {
                              if (line.startsWith(key)) {
                                  found = line.substring(key.length).trim().split(" ")[0].toLongOrNull() ?: -1L
                                  break
                              }
                          }
                          found
                      }
                  } catch (t: Throwable) {
                      -1L
                  }
              }

              private fun mb(kb: Long): Long = if (kb < 0L) -1L else kb / 1024L

              private fun fmt(mb: Long): String = if (mb < 0L) "n/a" else "$mb MB"

              /** RSS / swap of every process of THIS app (Android only lists the caller's own app here). */
              @JvmStatic
              fun ownProcesses(context: Context): List<ProcMem> {
                  val result = ArrayList<ProcMem>()
                  try {
                      val am = context.applicationContext.getSystemService(Context.ACTIVITY_SERVICE) as ActivityManager
                      val procs = am.runningAppProcesses ?: return result
                      for (p in procs) {
                          val rss = mb(readKb("/proc/" + p.pid + "/status", "VmRSS:"))
                          val swap = mb(readKb("/proc/" + p.pid + "/status", "VmSwap:"))
                          if (rss >= 0L) {
                              val shortName = p.processName.substringAfterLast(':', "main")
                              result.add(ProcMem(shortName, rss, swap))
                          }
                      }
                  } catch (t: Throwable) {
                      Logging.e(TAG, "Could not list own processes", t)
                  }
                  return result
              }

              @JvmStatic
              fun buildReport(context: Context): String {
                  val availKb = readKb("/proc/meminfo", "MemAvailable:")
                  val totalMb = mb(readKb("/proc/meminfo", "MemTotal:"))
                  val swapTotal = mb(readKb("/proc/meminfo", "SwapTotal:"))
                  val swapFree = mb(readKb("/proc/meminfo", "SwapFree:"))
                  val availMb = mb(availKb)

                  var lowFlag = false
                  var amAvail = -1L
                  try {
                      val am = context.getSystemService(Context.ACTIVITY_SERVICE) as ActivityManager
                      val info = ActivityManager.MemoryInfo()
                      am.getMemoryInfo(info)
                      lowFlag = info.lowMemory
                      amAvail = info.availMem / 1048576L
                  } catch (t: Throwable) {
                      // keep the /proc values
                  }
                  val freeMb = if (availMb >= 0L) availMb else if (amAvail >= 0L) amAvail else Tools.getFreeDeviceMemory(context).toLong()

                  val alloc = try {
                      AllSettings.ramAllocation.value.getValue()
                  } catch (t: Throwable) {
                      -1
                  }

                  val sb = StringBuilder()
                  sb.append("Phone RAM abhi\n")
                  sb.append("- Total: ").append(fmt(totalMb)).append('\n')
                  sb.append("- Free (MemAvailable): ").append(fmt(freeMb)).append('\n')
                  if (swapTotal >= 0L) {
                      sb.append("- Swap / virtual RAM (storage par, asli RAM se slow): ")
                          .append(if (swapFree >= 0L) (swapTotal - swapFree).toString() else "?")
                          .append(" MB used of ").append(swapTotal).append(" MB\n")
                  }
                  sb.append("- Android ka low-memory flag: ").append(if (lowFlag) "ON" else "off").append('\n')
                  sb.append('\n')
                  sb.append("Game ko diya hua RAM: ").append(if (alloc > 0) "$alloc MB" else "n/a").append('\n')
                  val procs = ownProcesses(context)
                  if (procs.isNotEmpty()) {
                      sb.append("Is app ke processes (RSS): ")
                      sb.append(procs.joinToString(", ") { it.name + " " + it.rssMb + " MB" })
                      sb.append('\n')
                  }
                  sb.append('\n')

                  if (alloc > 0 && freeMb >= 0L && alloc > freeMb) {
                      sb.append("WARNING: game ko diya RAM (").append(alloc).append(" MB) abhi free RAM (").append(freeMb)
                          .append(" MB) se zyada hai. Game me Android baaki apps band karega ya swap use hoga, ")
                          .append("jisse freeze / lag aa sakta hai. Settings me game RAM kam karo, ya neeche wala step karke ")
                          .append("ye check dobara chalao.\n")
                  } else if (alloc > 0 && freeMb >= 0L) {
                      sb.append("OK: abhi free RAM game ke RAM se zyada hai.\n")
                  }
                  if (lowFlag) {
                      sb.append("Android khud bata raha hai ki RAM kam hai: pehle Recents se apps band karo.\n")
                  }
                  sb.append('\n')
                  sb.append("Sach: Android 14/15 me koi bhi app (bina root) dusre apps se RAM zabardasti free nahi kar sakti. ")
                      .append("Isliye Lumen koi nakli 'RAM booster' nahi dikhata. Jo asli tareeke hain:\n")
                  sb.append("1) Game se pehle Recents me 'Close all' (ye tu khud karta hai, sabse asardaar).\n")
                  sb.append("2) Is check ko Close all ke baad chalao: free RAM badhi ya nahi, number se dikhega.\n")
                  sb.append("3) Optional test: Developer options -> 'Background process limit' = 'At most 2 processes' sirf ")
                      .append("game ke time. Game ke baad 'Standard limit' wapas karo (warna apps baar baar restart honge).\n")
                  Logging.i(TAG, "free=" + freeMb + " total=" + totalMb + " alloc=" + alloc + " lowFlag=" + lowFlag)
                  return sb.toString()
              }

              @JvmStatic
              fun showDialog(activity: Activity?) {
                  if (activity == null) return
                  try {
                      TipDialog.Builder(activity)
                          .setTitle("RAM check")
                          .setMessage(buildReport(activity))
                          .setCenterMessage(false)
                          .setSelectable(true)
                          .setConfirm("Developer options")
                          .setCancel("Band karo")
                          .setConfirmClickListener { openDeveloperOptions(activity) }
                          .showDialog()
                  } catch (t: Throwable) {
                      Logging.e(TAG, "RAM dialog failed", t)
                      Toast.makeText(activity, "RAM check khul nahi paya: " + t.javaClass.simpleName, Toast.LENGTH_LONG).show()
                  }
              }

              private fun openDeveloperOptions(activity: Activity) {
                  try {
                      activity.startActivity(Intent(Settings.ACTION_APPLICATION_DEVELOPMENT_SETTINGS))
                  } catch (t: Throwable) {
                      Toast.makeText(
                          activity,
                          "Developer options band hain. Settings -> About phone me Build/Software version ko 7 baar dabao.",
                          Toast.LENGTH_LONG
                      ).show()
                  }
              }
          }
