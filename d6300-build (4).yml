              @JvmStatic
              fun recordHeap(initialMb: Int, maxMb: Int) {
                  heapText = "Minecraft heap: -Xms " + initialMb + " MB, -Xmx " + maxMb + " MB"
              }

              @JvmStatic
              fun heapLine(): String = heapText

              /**
               * The first Lumen builds switched "Sustained performance" and "Force V-Sync" on by default.
               * Android documents sustained mode as capping the maximum CPU/GPU clocks (source.android.com,
               * "Performance management"), and V-Sync caps the frame rate at the panel refresh rate (90 Hz on the
               * vivo Y19 5G). Both are switched off exactly once; if the player turns them on again in Video
               * settings, that choice is kept.
               */
              private fun resetPerfDefaultsOnce() {
                  try {
                      if (perfFix2Unit.getValue() == "1") return
                      perfFix2Unit.put("1")
                          .put(AllSettings.sustainedPerformance, false)
                          .put(AllSettings.forceVsync, false)
                          .save()
                      Logging.i("PerformancePreset", "Sustained performance and force V-Sync switched off (one time)")
                  } catch (e: Exception) {
                      Logging.e("PerformancePreset", "resetPerfDefaultsOnce failed", e)
                  }
              }

              /**
               * Presets only ever make the game lighter: a value the player already set lower (for example
               * render distance 2) is kept, never raised to the preset's number.
               */
              private fun lighter(key: String, existing: String, wanted: String): String {
                  val want = wanted.toIntOrNull() ?: return wanted // true/false keys: the preset decides
                  val old = existing.trim().toIntOrNull() ?: return existing // unknown format: leave it alone
                  return when (key) {
                      "particles" -> maxOf(old, want).toString() // 0 all .. 2 minimal: higher = fewer particles
                      "maxFps" -> if (want >= 260) want.toString() else minOf(old, want).toString()
                      else -> minOf(old, want).toString() // distances, biome blend, graphics mode: lower = lighter
                  }
              }

              /** Called from LaunchArgs on every launch. Never throws. */
              @JvmStatic
              fun applyGameOptions(gameDir: File) {
                  try {
                      restoreResolutionOnce()
                      if (presetUnit.getValue() == CUSTOM) return
                      val spec = specs[effectiveUnit.getValue()] ?: return
                      val wanted = presetUnit.getValue() + "#" + stampUnit.getValue()
                      val marker = File(gameDir, "lumen_preset.txt")
                      if (marker.exists() && marker.readText().trim() == wanted) return
                      // Only edit an options.txt the game itself already wrote (it contains the data version line);
                      // a hand-made file could be mistaken for very old data by the game's data fixer.
                      val optionsFile = File(gameDir, "options.txt")
                      if (!optionsFile.isFile) return
                      val lines = optionsFile.readLines().toMutableList()
                      val values = linkedMapOf(
                          "renderDistance" to spec.renderDistance.toString(),
                          "simulationDistance" to spec.simulationDistance.toString(),
                          "particles" to spec.particles.toString(),
                          "graphicsMode" to spec.graphicsMode.toString(),
                          "entityShadows" to "false",
                          "biomeBlendRadius" to spec.biomeBlend.toString(),
                          "maxFps" to spec.maxFps.toString(),
                          "enableVsync" to spec.vsync.toString()
                      )
                      for ((k, v) in values) {
                          val idx = lines.indexOfFirst { it.startsWith("$k:") }
                          if (idx >= 0) {
                              lines[idx] = "$k:" + lighter(k, lines[idx].substringAfter(':'), v)
                          } else {
                              lines.add("$k:$v")
                          }
                      }
                      optionsFile.writeText(lines.joinToString("\n") + "\n")
                      marker.writeText(wanted)
                  } catch (e: Exception) {
                      Logging.e("PerformancePreset", "Could not apply game options", e)
                  }
              }

              /** Extra JVM flags for the chosen GC mode (empty = JDK default, nothing changes). */
              @JvmStatic
              fun extraJvmArgs(): Array<String> = when (gcUnit.getValue()) {
                  GC_SERIAL -> arrayOf("-XX:+UseSerialGC")
                  GC_G1_LIGHT -> arrayOf("-XX:+UseG1GC", "-XX:ParallelGCThreads=2", "-XX:ConcGCThreads=1")
                  GC_LOWRAM -> arrayOf("-XX:+UseSerialGC", "-Xmn" + LOWRAM_YOUNG_MB + "M")
                  else -> emptyArray<String>()
              }

              /**
               * "1" when the render thread should be pinned to the fast CPU cores. Exported as the environment
               * variable LUMEN_RENDER_PIN, which egl_bridge.c reads on the first presented frame. Default off.
               */
              @JvmStatic
              fun renderPinEnv(): String = if (pinUnit.getValue() == "1") "1" else "0"

              fun pinModeText(): String =
                  if (pinUnit.getValue() == "1") "Tez cores pe lock: ON (experimental)" else "Auto: Android khud decide karta hai"

              /** Major Java version from the runtime's "release" file (JAVA_VERSION="21.0.5" or "1.8.0_432"); -1 if unknown. */
              private fun javaMajor(release: File): Int {
                  if (!release.isFile) return -1
                  val line = release.readLines().firstOrNull { it.startsWith("JAVA_VERSION=") } ?: return -1
                  val parts = line.substringAfter('=').trim().trim('"').split('.', '-', '+', '_')
                  val first = parts.getOrNull(0)?.toIntOrNull() ?: return -1
                  return if (first == 1) (parts.getOrNull(1)?.toIntOrNull() ?: -1) else first
              }

              /**
               * JVM flags that write a GC + safepoint log to stability/gc_latest.log (Java 9 or newer), so a freeze
               * in the stability report can be matched to a real garbage collection. A log path the JVM cannot open
               * makes it refuse to start ("Invalid -Xlog option"), so the file is created here first and the flag is
               * left out on any doubt. Never throws.
               */
              @JvmStatic
              fun gcLogArgs(context: Context, runtimeHome: String): Array<String> {
                  try {
                      val major = javaMajor(File(runtimeHome, "release"))
                      if (major < 9) {
                          gcLogText = "GC log: off (Java " + (if (major > 0) major.toString() else "unknown") + ")"
                          return emptyArray<String>()
                      }
                      val base = context.getExternalFilesDir(null)
                      if (base == null) {
                          gcLogText = "GC log: off (no files dir)"
                          return emptyArray<String>()
                      }
                      val dir = File(base, "stability")
                      if (!dir.isDirectory && !dir.mkdirs()) {
                          gcLogText = "GC log: off (cannot create folder)"
                          return emptyArray<String>()
                      }
                      val file = File(dir, "gc_latest.log")
                      FileOutputStream(file).close() // fresh file; also proves this process may write here
                      val path = file.absolutePath
                      if (path.contains(':') || path.contains(',') || path.contains(' ')) {
                          gcLogText = "GC log: off (unusual path)"
                          return emptyArray<String>()
                      }
                      gcLogText = "GC log: on (Java " + major + ", stability/gc_latest.log)"
                      return arrayOf("-Xlog:gc,safepoint:file=" + path + ":uptime:filecount=0")
                  } catch (t: Throwable) {
                      gcLogText = "GC log: off (" + t.javaClass.simpleName + ")"
                      return emptyArray<String>()
                  }
              }

              @JvmStatic
              fun gcLogLine(): String = gcLogText

              fun gcModeText(): String = when (gcUnit.getValue()) {
                  GC_SERIAL -> "Serial GC"
                  GC_G1_LIGHT -> "G1 light (2 GC threads)"
                  GC_LOWRAM -> "Low-RAM (Serial, small young gen)"
                  else -> "Default (JDK)"
              }

              private fun summary(context: Context, key: String): String {
                  if (key == CUSTOM) return "Custom: koi preset nahi lagega, tumhare settings jaise hain waise rahenge."
                  val effective = if (key == AUTO) suggestedKey(context) else key
                  val s = specs[effective] ?: return "Preset set ho gaya."
                  return s.label + ": resolution NAHI badalta, aur jo value tumne pehle se kam rakhi hai (jaise render distance 2) use badhata bhi nahi. V-Sync " +
                      (if (s.vsync) "ON" else "OFF") +
                      ". Game options agle game launch se lagte hain, agar options.txt pehle se ban chuki ho."
              }

              fun showPicker(activity: Activity, onChanged: () -> Unit) {
                  val keys = arrayOf(AUTO, STABLE, BALANCED, MAX_FPS, CUSTOM)
