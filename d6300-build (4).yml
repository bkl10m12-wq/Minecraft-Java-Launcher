          // SDL window / text-input helpers used by com.movtery.zalithlauncher.game.sdl.SdlBridge
          // ---------------------------------------------------------------------------------------------
          typedef struct SDL_Window SDL_Window;
          typedef uint32_t SDL_PropertiesID;
          typedef void (*SDL_MainThreadCallback)(void *userdata);
          typedef bool (*sdlStartTextInput_t)(SDL_Window *, SDL_PropertiesID);
          typedef bool (*sdlStopTextInput_t)(SDL_Window *);
          typedef bool (*sdlIsTextInputActive_t)(SDL_Window *);
          typedef bool (*sdlRunOnMainThread_t)(SDL_MainThreadCallback, void *, bool);

          // Primary SDL window, updated by libexithook (sdl_hook.c) when the window is created/destroyed.
          static SDL_Window *sSdlPrimaryWindow = NULL;

          void sdlBridgeSetPrimaryWindow(struct SDL_Window *window) {
              sSdlPrimaryWindow = window;
          }

          static void sdlTextInputMainThreadCallback(void *userdata) {
              void *handle = dlopen("libSDL3.so", RTLD_NOW);
              if (handle == NULL) return;
              SDL_Window *window = sSdlPrimaryWindow;
              if (window == NULL) return;
              if (userdata != NULL) {
                  sdlStartTextInput_t start = (sdlStartTextInput_t) dlsym(handle, "SDL_StartTextInput");
                  if (start != NULL) start(window, 0);
              } else {
                  sdlStopTextInput_t stop = (sdlStopTextInput_t) dlsym(handle, "SDL_StopTextInput");
                  if (stop != NULL) stop(window);
              }
          }

          JNIEXPORT void JNICALL
          Java_com_movtery_zalithlauncher_game_sdl_SdlBridge_initializeControllerSubsystems(__attribute__((unused)) JNIEnv *env,
                                                                                            __attribute__((unused)) jclass clazz) {
              typedef int (*SDL_Init_Func)(unsigned int flags);
              void *handle = dlopen("libSDL3.so", RTLD_NOW);
              if (handle == NULL) return;
              SDL_Init_Func init = (SDL_Init_Func) dlsym(handle, "SDL_Init");
              if (init == NULL) return;
              // SDL_INIT_GAMEPAD=0x2000 | SDL_INIT_JOYSTICK=0x200 | SDL_INIT_EVENTS=0x4000
              init(0x2000u | 0x200u | 0x4000u);
          }

          JNIEXPORT jboolean JNICALL
          Java_com_movtery_zalithlauncher_game_sdl_SdlBridge_isSdlRenderActive(__attribute__((unused)) JNIEnv *env,
                                                                               __attribute__((unused)) jclass clazz) {
              return sSdlPrimaryWindow != NULL ? JNI_TRUE : JNI_FALSE;
          }

          JNIEXPORT jboolean JNICALL
          Java_com_movtery_zalithlauncher_game_sdl_SdlBridge_setNativeTextInputActive(__attribute__((unused)) JNIEnv *env,
                                                                                      __attribute__((unused)) jclass clazz,
                                                                                      jboolean active) {
              if (sSdlPrimaryWindow == NULL) return JNI_FALSE;
              void *handle = dlopen("libSDL3.so", RTLD_NOW);
              if (handle == NULL) return JNI_FALSE;
              sdlRunOnMainThread_t runOnMain = (sdlRunOnMainThread_t) dlsym(handle, "SDL_RunOnMainThread");
              if (runOnMain == NULL) return JNI_FALSE;
              bool result = runOnMain(sdlTextInputMainThreadCallback, (void *) (intptr_t) (active ? 1 : 0), false);
              return result ? JNI_TRUE : JNI_FALSE;
          }

          JNIEXPORT jboolean JNICALL
          Java_com_movtery_zalithlauncher_game_sdl_SdlBridge_isNativeTextInputActive(__attribute__((unused)) JNIEnv *env,
                                                                                     __attribute__((unused)) jclass clazz) {
              if (sSdlPrimaryWindow == NULL) return JNI_FALSE;
              void *handle = dlopen("libSDL3.so", RTLD_NOW);
              if (handle == NULL) return JNI_FALSE;
              sdlIsTextInputActive_t isActive = (sdlIsTextInputActive_t) dlsym(handle, "SDL_TextInputActive");
              if (isActive == NULL) return JNI_FALSE;
              return isActive(sSdlPrimaryWindow) ? JNI_TRUE : JNI_FALSE;
          }
