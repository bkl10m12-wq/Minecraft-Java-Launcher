                  switch (button) {
                      case LwjglGlfwKeycode.GLFW_MOUSE_BUTTON_LEFT:
                          aKey = MotionEvent.BUTTON_PRIMARY;
                          break;
                      case LwjglGlfwKeycode.GLFW_MOUSE_BUTTON_RIGHT:
