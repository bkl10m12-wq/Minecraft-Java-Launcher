          # 11. Legal / identity pack (always on) ------------------------------------------------------------
          # Why: a launcher that shows another project's name, ships Mojang's block art, phones an upstream feed
          # and offers to replace itself with another app is not safe to hand to other people.
          #  a) disclaimer + GPL/source/third-party block on the About page, "Source code" button -> our repository
          #  b) Mojang block/mob art, the default-avatar skin and the "ZALITH LAUNCHER" wordmark -> original artwork
          #  c) no in-app updater, no upstream notice feed, no REQUEST_INSTALL_PACKAGES, no upstream Discord/QQ buttons
          import json
          import os

          SOURCE_URL = os.environ.get("LUMEN_SOURCE_URL", "").strip() or "https://github.com/ZalithLauncher/ZalithLauncher"
          if not re.fullmatch(r"https://[A-Za-z0-9.-]+(/[A-Za-z0-9._~-]+)*", SOURCE_URL):
              sys.exit(f"PATCH FAILED: LUMEN_SOURCE_URL is not a plain https URL: {SOURCE_URL!r}")

