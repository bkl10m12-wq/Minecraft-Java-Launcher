          #!/usr/bin/env python3
          """Apply the Lumen Launcher patch to a checkout of ZalithLauncher/ZalithLauncher.

          Run from the repository root. Every edit asserts that its anchor text exists exactly
          once, so the script fails loudly instead of silently producing a half-patched tree.

          Edits:
            1. defaults in AllSettings.kt  (stability-oriented defaults for low-end Mali phones)
            2. MainActivity.java           (start/stop the StabilityMonitor)
            2b. LaunchArgs.kt              (Minecraft 26.x native-dir fix)
            2c. presets + GC mode + local skin hook (LaunchArgs.kt, Video settings screen)
            2d. Tools.java                 (missing client jar of inheriting versions, e.g. "26.3 Fabric")
            3. app label
            4. glass theme (colors, drawables, top bar, scrim, default background)
            5. main menu: Skin + Wallpaper buttons
            6. app icon (red dragon)
          The new Kotlin files and the Rust crate are written by the workflow before this runs.
          """
          import base64
          import pathlib
          import re
          import sys

          ROOT = pathlib.Path(".")
          MODULE = ROOT / "ZalithLauncher"
          RES = MODULE / "src/main/res"
          JAVA = MODULE / "src/main/java"


          def replace_once(path: pathlib.Path, old: str, new: str) -> None:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  sys.exit(f"PATCH FAILED: expected 1 match in {path}, found {count} for: {old!r}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")
              print(f"patched {path}: {old[:70]!r}")


          def write_file(path: pathlib.Path, content: str) -> None:
              if not path.parent.is_dir():
                  sys.exit(f"PATCH FAILED: directory missing for {path}")
              path.write_text(content, encoding="utf-8")
              print(f"wrote {path}")


          def set_color(path: pathlib.Path, name: str, value: str) -> None:
              text = path.read_text(encoding="utf-8")
              pattern = re.compile(r'(<color name="%s">)[^<]*(</color>)' % re.escape(name))
              found = pattern.findall(text)
              if len(found) != 1:
                  sys.exit(f"PATCH FAILED: expected 1 <color name={name}> in {path}, found {len(found)}")
              path.write_text(pattern.sub(lambda m: m.group(1) + value + m.group(2), text, count=1), encoding="utf-8")
              print(f"color {path.name}: {name} = {value}")


          def add_colors(path: pathlib.Path, items) -> None:
              text = path.read_text(encoding="utf-8")
              if text.count("</resources>") != 1:
                  sys.exit(f"PATCH FAILED: expected one </resources> in {path}")
              block = "".join(f'    <color name="{n}">{v}</color>\n' for n, v in items)
              path.write_text(text.replace("</resources>", block + "</resources>", 1), encoding="utf-8")
              print(f"added colors to {path.name}: {[n for n, _ in items]}")


          PRESET = "com.movtery.zalithlauncher.feature.preset.PerformancePreset"
          LUMEN = "com.movtery.zalithlauncher.feature.lumen"

          # 1. Defaults ---------------------------------------------------------------
          settings = JAVA / "com/movtery/zalithlauncher/setting/AllSettings.kt"
          for key in ["sustainedPerformance", "alternate_surface", "force_vsync", "gameMenuShowFPS"]:
              # bigCoreAffinity is deliberately NOT changed: at this upstream commit the env var
              # POJAV_BIG_CORE_AFFINITY is set but nothing in the native code reads it.
              replace_once(settings, f'BooleanSettingUnit("{key}", false)', f'BooleanSettingUnit("{key}", true)')

          # 2. MainActivity hooks -------------------------------------------------------
          main = JAVA / "net/kdt/pojavlaunch/MainActivity.java"
          replace_once(
              main,
              "import org.greenrobot.eventbus.EventBus;\n",
              "import org.greenrobot.eventbus.EventBus;\n"
              "import com.movtery.zalithlauncher.feature.stability.StabilityMonitor;\n",
          )
          replace_once(
              main,
              "    private GameMenuViewWrapper mGameMenuWrapper;\n",
              "    private GameMenuViewWrapper mGameMenuWrapper;\n"
              "    private StabilityMonitor mStabilityMonitor;\n",
          )
          replace_once(
              main,
              "        CallbackBridge.addGrabListener(binding.mainTouchpad);\n",
              "        CallbackBridge.addGrabListener(binding.mainTouchpad);\n"
              "        mStabilityMonitor = new StabilityMonitor(this);\n"
              "        mStabilityMonitor.start();\n",
          )
          replace_once(
              main,
              "        super.onDestroy();\n        mMenuSettingsInitListener.closeSpinner();\n",
              "        if (mStabilityMonitor != null) mStabilityMonitor.stop();\n"
              "        super.onDestroy();\n        mMenuSettingsInitListener.closeSpinner();\n",
          )

          # 2b. Minecraft 26.2+ launch fix ---------------------------------------------------
          # Evidence (user's latestlog.txt, Minecraft 26.3): the version JSON now passes
          #   -Djna.tmpdir / -Dorg.lwjgl.system.SharedLibraryExtractPath / -Dio.netty.native.workdir
          # pointing at <natives_directory>/<sub>, and Zalith sets natives_directory to the app's
          # read-only nativeLibraryDir (/data/app/...). 26.x creates those directories at startup ->
          # AccessDeniedException, crash "Loading native libraries".
          # The same log also shows a second -Djava.library.path (.../lib/arm64/java) that overrides the
          # launcher's own one. Zalith Launcher 2 fixes both the same way (redirect to cache dir / force
          # java.library.path to natives_directory), see its LaunchArgs.kt.
          launch_args = JAVA / "com/movtery/zalithlauncher/launch/LaunchArgs.kt"
          replace_once(
              launch_args,
              "        return JSONUtils.insertJSONValueList(minecraftArgs.toTypedArray<String>(), varArgMap)\n",
              r'''        // Applied AFTER ${natives_directory} substitution, so it does not depend on the token form.
                  val nativeDir = PathManager.DIR_NATIVE_LIB
                  val cacheDir = PathManager.DIR_CACHE.absolutePath
                  val writableDirProps = listOf(
                      "-Djna.tmpdir=",
                      "-Dorg.lwjgl.system.SharedLibraryExtractPath=",
                      "-Dio.netty.native.workdir="
                  )
                  fun String.d6300FixNativePaths(): String {
                      if (startsWith("-Djava.library.path=")) {
                          // keep unexpected custom values; only fix paths inside the app lib dir (26.x: <lib>/java)
                          return if (removePrefix("-Djava.library.path=").startsWith(nativeDir)) "-Djava.library.path=$nativeDir" else this
                      }
                      val prefix = writableDirProps.firstOrNull { startsWith(it) } ?: return this
                      val path = removePrefix(prefix)
                      if (!path.startsWith(nativeDir)) return this
                      val redirected = cacheDir + path.removePrefix(nativeDir)
                      File(redirected).mkdirs()
                      return prefix + redirected
                  }
                  val resolved = JSONUtils.insertJSONValueList(minecraftArgs.toTypedArray<String>(), varArgMap)
                  return resolved.map { it.d6300FixNativePaths() }.toTypedArray()
          ''',
          )

          # 2c. Performance presets, GC mode, local skin pack ----------------------------------
          # New files PerformancePreset.kt / LumenSkin.kt / LumenAppearance.kt are written by the workflow.
          #   - launch: write preset game options once per selection, prepare the local skin pack, add GC flags
          #   - Video settings: two rows ("Performance preset", "JVM GC mode") that open picker dialogs
          replace_once(
              launch_args,
              "        argsList.addAll(getJavaArgs())\n",
              f"        {PRESET}.applyGameOptions(gameDirPath)\n"
              f"        {LUMEN}.LumenSkin.prepareLocalSkinPack(account, gameDirPath)\n"
              "        argsList.addAll(getJavaArgs())\n"
              f"        argsList.addAll({PRESET}.extraJvmArgs().toList())\n",
          )


          def video_row(prefix: str, title: str, default: str) -> str:
              return f'''            <com.movtery.zalithlauncher.ui.layout.AnimRelativeLayout
                          android:id="@+id/{prefix}_layout"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:background="?android:attr/selectableItemBackground"
                          android:padding="@dimen/_12sdp">

                          <TextView
                              android:id="@+id/{prefix}_title"
                              android:layout_width="wrap_content"
                              android:layout_height="wrap_content"
                              android:layout_alignParentStart="true"
                              android:text="{title}"
                              android:textColor="@color/black_or_white" />

                          <TextView
                              android:id="@+id/{prefix}_value"
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:layout_below="@+id/{prefix}_title"
                              android:text="{default}" />
                      </com.movtery.zalithlauncher.ui.layout.AnimRelativeLayout>

          '''


          video_layout = RES / "layout/settings_fragment_video.xml"
          renderer_row_anchor = (
              '            <com.movtery.zalithlauncher.ui.layout.AnimRelativeLayout\n'
              '                android:id="@+id/renderer_layout"\n'
          )
          replace_once(
              video_layout,
              renderer_row_anchor,
              video_row("preset", "Performance preset (resolution same rehta hai)", "Custom")
              + video_row("gc", "JVM GC mode (A/B test)", "Default (JDK)")
              + renderer_row_anchor,
          )

          video_fragment = JAVA / "com/movtery/zalithlauncher/ui/fragment/settings/VideoSettingsFragment.kt"
          replace_once(
              video_fragment,
              "        val renderers = Renderers.getCompatibleRenderers(context).first\n",
              f"        binding.presetValue.text = {PRESET}.valueText(context)\n"
              "        binding.presetLayout.setOnClickListener {\n"
              f"            {PRESET}.showPicker(context) {{\n"
              f"                binding.presetValue.text = {PRESET}.valueText(context)\n"
              "            }\n"
              "        }\n"
              f"        binding.gcValue.text = {PRESET}.gcModeText()\n"
              "        binding.gcLayout.setOnClickListener {\n"
              f"            {PRESET}.showGcPicker(context) {{\n"
              f"                binding.gcValue.text = {PRESET}.gcModeText()\n"
              "            }\n"
              "        }\n"
              "\n"
              "        val renderers = Renderers.getCompatibleRenderers(context).first\n",
          )

          # 2d. Missing client jar of inheriting versions (e.g. "26.3 Fabric") --------------------
          # Evidence (user's latestlog.txt): Fabric aborted with "Class path entries reference missing files:
          # .../versions/26.3 Fabric/26.3 Fabric.jar" -> "Minecraft game provider couldn't locate the game".
          # Zalith copies the parent jar into the child folder inside MinecraftDownloader.ensureJarFileCopy(),
          # but the logs of that launch contain no "Copying ..." line, so the copy did not happen (reason not
          # visible in the logs). Self-heal: right before the class path is built, copy the parent's jar if the
          # child's own jar is missing and the parent's jar exists. Does nothing in any other case.
          tools_java = JAVA / "net/kdt/pojavlaunch/Tools.java"
          replace_once(
              tools_java,
              "    public static String getClientClasspath(Version version) {\n"
              "        return new File(version.getVersionPath(), version.getVersionName() + \".jar\").getAbsolutePath();\n"
              "    }\n",
              r'''    public static String getClientClasspath(Version version) {
                  File clientJar = new File(version.getVersionPath(), version.getVersionName() + ".jar");
                  lumenRepairClientJar(version, clientJar);
                  return clientJar.getAbsolutePath();
              }

              /** Copies the parent version's jar into this version's folder when it is missing (never throws). */
              private static void lumenRepairClientJar(Version version, File clientJar) {
                  if (clientJar.isFile()) return;
                  try {
                      JMinecraftVersionList.Version info = GLOBAL_GSON.fromJson(
                              read(new File(version.getVersionPath(), version.getVersionName() + ".json")),
                              JMinecraftVersionList.Version.class);
                      if (info == null || info.inheritsFrom == null || info.inheritsFrom.isEmpty()) return;
                      File parentJar = new File(version.getVersionsFolder(), info.inheritsFrom + "/" + info.inheritsFrom + ".jar");
                      if (parentJar.isFile() && parentJar.length() > 0) {
                          org.apache.commons.io.FileUtils.copyFile(parentJar, clientJar, false);
                          Logging.i("Lumen", "Copied " + parentJar.getAbsolutePath() + " -> " + clientJar.getAbsolutePath());
                      } else {
                          Logging.w("Lumen", "Parent jar missing too: " + parentJar.getAbsolutePath());
                      }
                  } catch (Throwable t) {
                      Logging.w("Lumen", "Could not repair client jar", t);
                  }
              }
          ''',
          )

          # 3. App label ----------------------------------------------------------------
          replace_once(
              MODULE / "gradle.properties",
              "launcher_app_name=Zalith Launcher\n",
              "launcher_app_name=Lumen Launcher\n",
          )

          # 4. Glass theme --------------------------------------------------------------
          # Translucent panels + thin light border + faint top highlight. No per-frame blur (that costs GPU on
          # Mali and would hurt UI smoothness); the "glass" comes from transparency over the wallpaper.
          colors_day = RES / "values/colors.xml"
          colors_night = RES / "values-night/colors_night.xml"
          day = {
              "background_menu_top": "#992D8B9C",
              "button_background": "#80FFFFFF",
              "button_background_selected": "#B3FFFFFF",
              "dialog_background": "#F2F4F4F4",
              "menu_bar": "#80FFFFFF",
              "menu_overlay": "#99FFFFFF",
              "background_item": "#80FFFFFF",
              "background_item_selected": "#B3FFFFFF",
              "background_item_disabled": "#80FFDADA",
              "edit_box_fill": "#80FFFFFF",
              "edit_box_fill_selected": "#B3FFFFFF",
              "mod_category_fill": "#4DFFFFFF",
              "text_background_fill": "#66FFFFFF",
          }
          night = {
              "background_menu_top": "#66000000",
              "button_background": "#66202028",
              "button_background_selected": "#B3405060",
              "dialog_background": "#F2121218",
              "menu_bar": "#66000000",
              "menu_overlay": "#8C000000",
              "background_item": "#59000000",
              "background_item_selected": "#8032A8B8",
              "background_item_disabled": "#66803030",
              "edit_box_fill": "#66000000",
              "edit_box_fill_selected": "#80000000",
              "mod_category_fill": "#4D000000",
              "text_background_fill": "#66000000",
          }
          for name, value in day.items():
              set_color(colors_day, name, value)
          for name, value in night.items():
              set_color(colors_night, name, value)
          add_colors(
              colors_day,
              [
                  ("lumen_glass_stroke", "#99FFFFFF"),
                  ("lumen_glass_highlight_top", "#4DFFFFFF"),
                  ("lumen_glass_highlight_bottom", "#0AFFFFFF"),
                  ("lumen_scrim", "#14000000"),
              ],
          )
          add_colors(
              colors_night,
              [
                  ("lumen_glass_stroke", "#47FFFFFF"),
                  ("lumen_glass_highlight_top", "#2EFFFFFF"),
                  ("lumen_glass_highlight_bottom", "#05FFFFFF"),
                  ("lumen_scrim", "#4D000000"),
              ],
          )


          def glass_shape(radius: str, fill: str) -> str:
              return f'''<?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
              <item>
                  <shape android:shape="rectangle">
                      <corners android:radius="{radius}" />
                      <solid android:color="@color/{fill}" />
                  </shape>
              </item>
              <item>
                  <shape android:shape="rectangle">
                      <corners android:radius="{radius}" />
                      <gradient
                          android:angle="270"
                          android:startColor="@color/lumen_glass_highlight_top"
                          android:endColor="@color/lumen_glass_highlight_bottom" />
                      <stroke android:width="1dp" android:color="@color/lumen_glass_stroke" />
                  </shape>
              </item>
          </layer-list>
          '''


          drawable = RES / "drawable"
          write_file(drawable / "background_item_unselected.xml", glass_shape("@dimen/_6sdp", "background_item"))
          write_file(drawable / "background_item_selected.xml", glass_shape("@dimen/_6sdp", "background_item_selected"))
          write_file(drawable / "background_item_disabled.xml", glass_shape("@dimen/_6sdp", "background_item_disabled"))
          write_file(drawable / "background_card.xml", glass_shape("@dimen/_8sdp", "menu_overlay"))
          write_file(
              drawable / "dialog_background.xml",
              '''<?xml version="1.0" encoding="utf-8"?>
          <inset xmlns:android="http://schemas.android.com/apk/res/android">
              <shape android:shape="rectangle">
                  <corners android:radius="@dimen/_8sdp" />
                  <solid android:color="@color/dialog_background" />
                  <stroke android:width="1dp" android:color="@color/lumen_glass_stroke" />
              </shape>
          </inset>
          ''',
          )

          # default background when no wallpaper is set (night: dark crimson, day: soft sky)
          write_file(
              drawable / "lumen_default_bg.xml",
              '''<?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <gradient
                  android:angle="315"
                  android:startColor="#FFCFE3EE"
                  android:centerColor="#FFDCE0F0"
                  android:endColor="#FFE9D5EC"
                  android:type="linear" />
          </shape>
          ''',
          )
          night_drawable = RES / "drawable-night"
          night_drawable.mkdir(exist_ok=True)
          write_file(
              night_drawable / "lumen_default_bg.xml",
              '''<?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <gradient
                  android:angle="315"
                  android:startColor="#FF0D0508"
                  android:centerColor="#FF4A0E16"
                  android:endColor="#FF1A0B26"
                  android:type="linear" />
          </shape>
          ''',
          )

          replace_once(
              JAVA / "com/movtery/zalithlauncher/feature/background/BackgroundManager.kt",
              "        backgroundView.setImageDrawable(\n"
              "            ContextCompat.getDrawable(context, R.color.background_app)\n"
              "        )\n",
              "        backgroundView.setImageDrawable(\n"
              "            ContextCompat.getDrawable(\n"
              "                context,\n"
              "                if (backgroundType == BackgroundType.MAIN_MENU) R.drawable.lumen_default_bg else R.color.background_app\n"
              "            )\n"
              "        )\n",
          )

          # scrim over the wallpaper (keeps text readable on bright pictures)
          replace_once(
              RES / "layout/activity_launcher.xml",
              '    <ImageView\n'
              '        android:id="@+id/background_view"\n'
              '        android:layout_width="match_parent"\n'
              '        android:layout_height="match_parent"/>\n',
              '    <ImageView\n'
              '        android:id="@+id/background_view"\n'
              '        android:layout_width="match_parent"\n'
              '        android:layout_height="match_parent"\n'
              '        android:foreground="@color/lumen_scrim"/>\n',
          )

          launcher_activity = JAVA / "net/kdt/pojavlaunch/LauncherActivity.java"
          # translucent top bar tinted from the wallpaper
          replace_once(
              launcher_activity,
              "                binding.topLayout.setBackgroundColor(\n"
              "                        isDarkMode ?\n"
              "                                palette.getDarkVibrantColor(backgroundMenuTop) :\n"
              "                                palette.getLightVibrantColor(backgroundMenuTop)\n"
              "                );\n",
              "                binding.topLayout.setBackgroundColor(androidx.core.graphics.ColorUtils.setAlphaComponent(\n"
              "                        isDarkMode ?\n"
              "                                palette.getDarkVibrantColor(backgroundMenuTop) :\n"
              "                                palette.getLightVibrantColor(backgroundMenuTop), 0x70));\n",
          )
          # undo the render-scale cut of the first Lumen presets (once)
          replace_once(
              launcher_activity,
              "        mNotificationManager = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);\n",
              "        mNotificationManager = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);\n"
              f"        {PRESET}.restoreResolutionOnce();\n",
          )

          # 5. Main menu: Skin + Wallpaper buttons (under "Execute .jar file") --------------------
          write_file(
              drawable / "ic_lumen_skin.xml",
              '''<vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp"
              android:height="24dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
              <path
                  android:fillColor="@color/icon_color"
                  android:pathData="M12,12c2.21,0 4,-1.79 4,-4s-1.79,-4 -4,-4 -4,1.79 -4,4 1.79,4 4,4zM12,14c-2.67,0 -8,1.34 -8,4v2h16v-2c0,-2.66 -5.33,-4 -8,-4z" />
          </vector>
          ''',
          )
          write_file(
              drawable / "ic_lumen_wallpaper.xml",
              '''<vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp"
              android:height="24dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
              <path
                  android:fillColor="@color/icon_color"
                  android:pathData="M21,19V5c0,-1.1 -0.9,-2 -2,-2H5c-1.1,0 -2,0.9 -2,2v14c0,1.1 0.9,2 2,2h14c1.1,0 2,-0.9 2,-2zM8.5,13.5l2.5,3.01L14.5,12l4.5,6H5l3.5,-4.5z" />
          </vector>
          ''',
          )


          def menu_item(prefix: str, icon: str, label: str) -> str:
              return f'''                <com.movtery.zalithlauncher.ui.layout.AnimRelativeLayout
                              android:id="@+id/{prefix}_button"
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:layout_marginTop="@dimen/_12sdp"
                              android:layout_marginStart="@dimen/_12sdp"
                              android:layout_marginEnd="@dimen/_8sdp"
                              android:background="@drawable/background_item"
                              android:paddingHorizontal="@dimen/_8sdp"
                              android:paddingVertical="@dimen/_12sdp"
                              app:ripple_for_relative="true">

                              <ImageView
                                  android:id="@+id/{prefix}_icon"
                                  android:layout_width="@dimen/_24sdp"
                                  android:layout_height="@dimen/_24sdp"
                                  android:layout_marginStart="@dimen/_8sdp"
                                  android:layout_alignParentStart="true"
                                  android:layout_centerVertical="true"
                                  android:src="@drawable/{icon}"/>

                              <TextView
                                  android:layout_width="0dp"
                                  android:layout_height="wrap_content"
                                  android:layout_marginStart="@dimen/_16sdp"
                                  android:layout_marginEnd="@dimen/_8sdp"
                                  android:layout_alignParentEnd="true"
                                  android:layout_centerVertical="true"
                                  android:layout_toEndOf="@id/{prefix}_icon"
                                  android:text="{label}"
                                  android:textSize="@dimen/_12sdp"
                                  android:textColor="@color/primary_text"/>

                          </com.movtery.zalithlauncher.ui.layout.AnimRelativeLayout>

          '''


          menu_layout = RES / "layout/fragment_launcher.xml"
          share_anchor = (
              '                <com.movtery.zalithlauncher.ui.layout.AnimRelativeLayout\n'
              '                    android:id="@+id/share_logs_button"\n'
          )
          replace_once(
              menu_layout,
              share_anchor,
              menu_item("skin", "ic_lumen_skin", "Skin (gallery se)")
              + menu_item("wallpaper", "ic_lumen_wallpaper", "Wallpaper (gallery se)")
              + share_anchor,
          )
          # drop the elevation shadows of the home-screen items (they show through translucent glass and cost overdraw)
          menu_text = menu_layout.read_text(encoding="utf-8")
          cleaned, removed = re.subn(r'\n[ \t]*android:translationZ="[^"]*"(?=\n)', "", menu_text)
          if removed < 1:
              sys.exit("PATCH FAILED: no translationZ removed in fragment_launcher.xml")
          menu_layout.write_text(cleaned, encoding="utf-8")
          print(f"removed {removed} translationZ attributes from fragment_launcher.xml")

          menu_fragment = JAVA / "net/kdt/pojavlaunch/fragments/MainMenuFragment.java"
          replace_once(
              menu_fragment,
              "    private AccountViewWrapper accountViewWrapper;\n",
              "    private AccountViewWrapper accountViewWrapper;\n"
              "    private final androidx.activity.result.ActivityResultLauncher<String> lumenWallpaperPicker =\n"
              "            registerForActivityResult(new androidx.activity.result.contract.ActivityResultContracts.GetContent(),\n"
              f"                    uri -> {LUMEN}.LumenAppearance.onWallpaperPicked(getContext(), uri));\n"
              "    private final androidx.activity.result.ActivityResultLauncher<String> lumenSkinPicker =\n"
              "            registerForActivityResult(new androidx.activity.result.contract.ActivityResultContracts.GetContent(),\n"
              f"                    uri -> {LUMEN}.LumenSkin.onSkinPicked(getActivity(), uri));\n",
          )
          replace_once(
              menu_fragment,
              "        binding.shareLogsButton.setOnClickListener(v -> ZHTools.shareLogs(requireActivity()));\n",
              "        binding.shareLogsButton.setOnClickListener(v -> ZHTools.shareLogs(requireActivity()));\n"
              "        binding.skinButton.setOnClickListener(v -> lumenSkinPicker.launch(\"image/png\"));\n"
              "        binding.wallpaperButton.setOnClickListener(v -> lumenWallpaperPicker.launch(\"image/*\"));\n"
              "        binding.wallpaperButton.setOnLongClickListener(v -> {\n"
              f"            {LUMEN}.LumenAppearance.clearWallpaper(getContext());\n"
              "            return true;\n"
              "        });\n",
          )

          # 6. App icon (red dragon logo) -----------------------------------------------------
          # Foreground = black dragon on transparent (alpha taken from the supplied logo), background = red radial
          # gradient. One xxxhdpi PNG is enough: the older density copies are removed so Android scales this one.
          for old_fg in RES.glob("mipmap-*/ic_launcher_foreground.png"):
              old_fg.unlink()
              print(f"removed {old_fg}")
          fg = base64.b64decode(pathlib.Path("lumen_logo_fg.b64").read_text())
          if not fg.startswith(b"\x89PNG"):
              sys.exit("PATCH FAILED: logo data is not a PNG")
          (RES / "mipmap-xxxhdpi/ic_launcher_foreground.png").write_bytes(fg)
          print(f"wrote logo foreground ({len(fg)} bytes)")
          write_file(
              drawable / "ic_launcher_background.xml",
              '''<?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <gradient
                  android:type="radial"
                  android:centerX="0.5"
                  android:centerY="0.5"
                  android:gradientRadius="75%p"
                  android:startColor="#FFFF0A0A"
                  android:endColor="#FF8A0000" />
          </shape>
          ''',
          )

          print("Lumen patch applied.")
          D6300_EOF

      - name: Apply D6300 patch
        run: python3 apply_d6300.py

      - name: Build Rust stability core (optional, APK still builds if this fails)
        continue-on-error: true
        run: |
          set -e
          rustup target add aarch64-linux-android
          NDK="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-}}"
          if [ -z "$NDK" ] || [ ! -d "$NDK" ]; then NDK="$(ls -d "$ANDROID_SDK_ROOT"/ndk/* | sort -V | tail -1)"; fi
          echo "Using NDK: $NDK"
          TOOLBIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$TOOLBIN/aarch64-linux-android26-clang"
          (cd d6300-core && cargo test --release && cargo build --release --target aarch64-linux-android)
          mkdir -p ZalithLauncher/src/main/jniLibs/arm64-v8a
          cp d6300-core/target/aarch64-linux-android/release/libd6300core.so ZalithLauncher/src/main/jniLibs/arm64-v8a/
          ls -l ZalithLauncher/src/main/jniLibs/arm64-v8a/

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build JRE JAR files
        run: |
          chmod +x gradlew
          mkdir out
          ./gradlew jre_lwjgl3glfw:build --no-daemon

      - name: Build debug APK (arm64)
        run: |
          chmod +x gradlew
          ./gradlew ZalithLauncher:assembleDebug -Darch=arm64

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Lumen-Launcher-debug-arm64
          path: ZalithLauncher/build/outputs/apk/debug/*.apk
