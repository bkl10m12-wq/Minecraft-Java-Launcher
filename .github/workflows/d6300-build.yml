                      val packDir = File(gameDir, "resourcepacks")
                      packDir.mkdirs()
                      ZipOutputStream(FileOutputStream(File(packDir, PACK_NAME))).use { zip ->
                          fun put(path: String, data: ByteArray) {
                              zip.putNextEntry(ZipEntry(path))
                              zip.write(data)
                              zip.closeEntry()
                          }
                          put("pack.mcmeta", MCMETA.toByteArray(Charsets.UTF_8))
                          for (name in DEFAULT_SKIN_NAMES) {
                              put("assets/minecraft/textures/entity/player/wide/$name.png", png)
                              put("assets/minecraft/textures/entity/player/slim/$name.png", png)
                          }
                          // pre-1.19.3 locations
                          put("assets/minecraft/textures/entity/steve.png", png)
                          put("assets/minecraft/textures/entity/alex.png", png)
                      }
                      enableInOptions(gameDir)
                  } catch (t: Throwable) {
                      Logging.e(TAG, "Could not prepare local skin pack", t)
                  }
              }

              private fun enableInOptions(gameDir: File) {
                  val options = File(gameDir, "options.txt")
                  if (!options.isFile) return
                  val entry = "\"file/$PACK_NAME\""
                  val lines = options.readLines().toMutableList()
                  val idx = lines.indexOfFirst { it.startsWith("resourcePacks:") }
                  if (idx < 0) {
                      lines.add("resourcePacks:[\"vanilla\",$entry]")
                  } else {
                      val line = lines[idx]
                      if (line.contains(entry)) return
                      val open = line.indexOf('[')
                      val close = line.lastIndexOf(']')
                      if (open < 0 || close < open) return
                      val inner = line.substring(open + 1, close).trim()
                      lines[idx] = "resourcePacks:[" + (if (inner.isEmpty()) "" else "$inner,") + entry + "]"
                  }
                  options.writeText(lines.joinToString("\n") + "\n")
              }
          }
