          /**
           * One-tap wallpaper for the main menu: the gallery opens, the chosen picture is copied into the
           * launcher's background folder and selected as MAIN_MENU background (the same mechanism as
           * Settings -> Custom background, just without the two extra steps).
           */
          object LumenAppearance {
              private const val TAG = "LumenAppearance"
              private const val PREFIX = "lumen_wallpaper_"

              private fun toast(context: Context, text: String) {
                  Handler(Looper.getMainLooper()).post {
                      try {
                          Toast.makeText(context.applicationContext, text, Toast.LENGTH_LONG).show()
                      } catch (t: Throwable) {
                          // best effort only
                      }
                  }
              }

              /** The background change event must be posted on the UI thread (the receiver touches views). */
              private fun notifyChanged() {
                  Handler(Looper.getMainLooper()).post {
                      EventBus.getDefault().post(MainBackgroundChangeEvent())
                  }
              }

              private fun currentMap(): EnumMap<BackgroundType, String> {
                  val map = EnumMap<BackgroundType, String>(BackgroundType::class.java)
                  val props = BackgroundManager.properties
                  for (type in BackgroundType.values()) {
                      val value = props[type.name] as String?
                      if (value != null && value != BackgroundManager.NULL) map[type] = value
                  }
                  return map
              }

              @JvmStatic
              fun onWallpaperPicked(context: Context?, uri: Uri?) {
                  if (context == null || uri == null) return
                  val app = context.applicationContext
                  Thread {
                      try {
                          val dir = PathManager.DIR_BACKGROUND
                          if (!dir.exists()) dir.mkdirs()
                          val mime = app.contentResolver.getType(uri) ?: ""
                          val ext = when {
                              mime.contains("png") -> "png"
                              mime.contains("webp") -> "webp"
                              else -> "jpg"
                          }
                          val target = File(dir, PREFIX + System.currentTimeMillis() + "." + ext)
                          val input = app.contentResolver.openInputStream(uri)
                          if (input == null) {
                              toast(app, "Image khul nahi payi.")
                              return@Thread
                          }
                          input.use { src -> target.outputStream().use { out -> src.copyTo(out) } }

                          val bounds = BitmapFactory.Options()
                          bounds.inJustDecodeBounds = true
                          BitmapFactory.decodeFile(target.absolutePath, bounds)
                          if (bounds.outWidth <= 0 || bounds.outHeight <= 0) {
                              target.delete()
                              toast(app, "Ye image file nahi lagti (JPG / PNG / WEBP chuno).")
                              return@Thread
                          }

                          val map = currentMap()
                          map[BackgroundType.MAIN_MENU] = target.name
                          BackgroundManager.saveProperties(map)

                          // remove older wallpapers picked this way (unique names also keep Glide's cache fresh)
                          val old = dir.listFiles()
                          if (old != null) {
                              for (f in old) {
                                  if (f.name.startsWith(PREFIX) && f.name != target.name) f.delete()
                              }
                          }
                          notifyChanged()
                          toast(app, "Wallpaper lag gaya. Hatane ke liye Wallpaper button ko dabaye rakho.")
                      } catch (t: Throwable) {
                          Logging.e(TAG, "Could not set wallpaper", t)
                          toast(app, "Wallpaper set nahi hua: " + t.javaClass.simpleName)
                      }
                  }.start()
              }

              @JvmStatic
              fun clearWallpaper(context: Context?) {
                  if (context == null) return
                  val app = context.applicationContext
                  Thread {
                      try {
                          val map = currentMap()
                          map.remove(BackgroundType.MAIN_MENU)
                          BackgroundManager.saveProperties(map)
                          notifyChanged()
                          toast(app, "Wallpaper hata diya (default glass background).")
                      } catch (t: Throwable) {
                          Logging.e(TAG, "Could not clear wallpaper", t)
                      }
                  }.start()
              }
          }
